name: Compilar Krono Finanzas (.exe Windows)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'package.json'
      - 'main.js'
      - 'preload.js'
      - 'icon.ico'
      - 'icon.png'
      - '.github/workflows/build-windows.yml'

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias de Electron
        run: npm install

      - name: Compilar instalador y portable (.exe)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run build:win

      - name: Subir ejecutables (.exe) para descargar
        uses: actions/upload-artifact@v4
        with:
          name: Krono-Finanzas-Windows-EXE
          path: |
            dist/*.exe
          if-no-files-found: error
          retention-days: 30
