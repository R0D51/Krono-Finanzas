          await processGeminiCommand(cleanCmd, true);

          state.externalCommandHistory.unshift({ id: cmdId, command: cleanCmd, date: new Date().toLocaleTimeString('es-UY', { hour: '2-digit', minute: '2-digit' }) });

    async function applyOtaUpdatePayload(rawPayload, versionLabel = null, broadcastToCloud = true, publishRelease = false, releaseNotes = '') {
      if (!rawPayload || !String(rawPayload).trim()) return false;
      const text = String(rawPayload).trim();
      let targetHtml = null, targetVersion = (versionLabel || ('OTA-' + new Date().toLocaleDateString('es-UY'))).replace(/^v/i, '');
      if (text.startsWith('{')) {
        try {
          const parsed = JSON.parse(text);
          if (parsed.version) targetVersion = String(parsed.version).replace(/^v/i, '').trim();
          if ((parsed.css || parsed.js) && !parsed.html) {
            if (parsed.css) localStorage.setItem('KRONO_OTA_LIVE_CSS', parsed.css);
            if (parsed.js) localStorage.setItem('KRONO_OTA_LIVE_JS', parsed.js);
            localStorage.setItem('KRONO_OTA_VERSION_TAG', targetVersion);
            loadLivePatches(); ui.otaStatusMsg = `✅ Parche v${targetVersion} aplicado.`;
            spawnFloatingBurst(`🏷️ v${targetVersion}`, true); render(); return true;
          }
          if (parsed.html && (parsed.html.includes('<!DOCTYPE html>') || parsed.html.includes('<html'))) targetHtml = parsed.html;
        } catch (err) { ui.otaStatusMsg = '❌ Error al leer JSON OTA.'; render(); return false; }
      } else if (text.includes('<!DOCTYPE html>') || text.includes('<html')) {
        targetHtml = text;
        const m = text.match(/APP_BASE_VERSION\s*=\s*['"]([^'"]+)['"]/);
        if (!versionLabel && m && m[1]) targetVersion = m[1].replace(/^v/i, '');
      }
      if (targetHtml) {
        localStorage.removeItem('KRONO_OTA_LIVE_CSS');
        localStorage.removeItem('KRONO_OTA_LIVE_JS');
        localStorage.setItem('KRONO_OTA_CUSTOM_HTML', targetHtml);
        localStorage.setItem('KRONO_OTA_VERSION_TAG', targetVersion);
        state.lastReleaseTag = 'v' + targetVersion;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        ui.otaStatusMsg = `✅ v${targetVersion} instalada. Reiniciando...`;
        spawnFloatingBurst(`🏷️ v${targetVersion}`, true);
        if (publishRelease && cleanRepoSlug() && getActiveGitHubToken()) await publishGitHubRelease(targetHtml, targetVersion, releaseNotes || `Release v${targetVersion}`);
        if (syncChannel) syncChannel.postMessage({ type: 'OTA_APPLIED' });
        setTimeout(() => window.location.reload(), 650);
        return true;
      }
      ui.otaStatusMsg = '⚠️ Formato OTA no reconocido.'; render(); return false;
    }
    function rollbackFactoryOta() {

      localStorage.removeItem('KRONO_OTA_CUSTOM_HTML'); localStorage.removeItem('KRONO_OTA_VERSION_TAG');

    async function fetchPayloadForReleaseTag(repo, releaseObj) {
      const tag = releaseObj.tag_name || (state.githubBranch || 'main');
      const candidates = [(state.githubFilePath || 'ota.json').trim().replace(/^\/+/, '') || 'ota.json', 'ota.json', 'index.html'];
      for (const file of candidates) {
        try {
          const res = await fetch(`https://api.github.com/repos/${repo}/contents/${file}?ref=${encodeURIComponent(tag)}&t=${Date.now()}`, { headers: getGitHubHeaders(), cache: 'no-store' });
          if (res.ok) { const m = await res.json(); if (m && m.content) return decodeURIComponent(escape(atob(m.content.replace(/\s/g, '')))); }
        } catch (e) {}
        try {
          const raw = await fetch(`https://raw.githubusercontent.com/${repo}/${encodeURIComponent(tag)}/${file}?t=${Date.now()}`, { cache: 'no-store' });
          if (raw.ok) return await raw.text();
        } catch (e) {}
      }
      return '';
    }
    async function checkGitHubReleaseOtaUpdate(manual = false) {
      const repo = cleanRepoSlug(); if (!repo) return false;
      ui.otaChecking = true;
      if (manual) { ui.otaStatusMsg = `🔍 Buscando Release en ${repo}...`; render(); }
      try {
        const res = await fetch(`https://api.github.com/repos/${repo}/releases/latest?t=${Date.now()}`, { headers: getGitHubHeaders(), cache: 'no-store' });
        if (!res.ok) { ui.otaChecking = false; return false; }
        const rel = await res.json();
        if (!rel || !rel.tag_name) { ui.otaChecking = false; return false; }
        const rTag = String(rel.tag_name).trim(), rVer = rTag.replace(/^v/i, '');
        state.lastReleaseTag = rTag; localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        if (isNewerVersion(rVer, getCurrentInstalledVersion())) {
          ui.otaStatusMsg = `🏷️ Descargando ${rTag}...`; render();
          const payload = await fetchPayloadForReleaseTag(repo, rel);
          ui.otaChecking = false;
          if (!payload) return false;
          await applyOtaUpdatePayload(payload, rVer, false, false);
          return true;
        } else {
          ui.otaChecking = false;
          if (manual) { ui.otaStatusMsg = `✅ Estás al día (${rTag}).`; render(); }
          return false;
        }
      } catch (e) { ui.otaChecking = false; return false; }

    async function pushSingleFileToGitHub(repo, branch, path, contentStr, commitMsg, token) {
      const apiUrl = `https://api.github.com/repos/${repo}/contents/${path}`;
      const headers = { 'Accept': 'application/vnd.github.v3+json', 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' };
      let sha = null;
      try { const g = await fetch(`${apiUrl}?ref=${encodeURIComponent(branch)}&t=${Date.now()}`, { headers, cache: 'no-store' }); if (g.ok) { const j = await g.json(); if (j && j.sha) sha = j.sha; } } catch (e) {}
      const body = { message: commitMsg, content: btoa(unescape(encodeURIComponent(sanitizeHtmlForGitHubUpload(contentStr)))), branch };
      if (sha) body.sha = sha;
      const p = await fetch(apiUrl, { method: 'PUT', headers, body: JSON.stringify(body) });
      if (!p.ok) throw new Error('HTTP ' + p.status);
      return await p.json();
    }
    async function publishGitHubRelease(rawHtmlOrJson = null, versionTag = null, customNotes = '') {
      const repo = cleanRepoSlug(), token = getActiveGitHubToken();
      if (!repo || !token) return false;
      let branch = (state.githubBranch || 'main').trim() || 'main';
      ui.githubPushing = true; ui.otaStatusMsg = `🏷️ Publicando en ${repo}...`; render();
      try {
        const headers = { 'Accept': 'application/vnd.github.v3+json', 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' };
        try { const rr = await fetch(`https://api.github.com/repos/${repo}?t=${Date.now()}`, { headers, cache: 'no-store' }); if (rr.ok) { const rm = await rr.json(); if (rm && rm.default_branch) branch = rm.default_branch; } } catch (e) {}
        const ver = (versionTag || getCurrentInstalledVersion()).replace(/^v/i, ''), tagName = 'v' + ver;
        let html = localStorage.getItem('KRONO_OTA_CUSTOM_HTML') || ('<!DOCTYPE html>' + document.documentElement.outerHTML);
        if (rawHtmlOrJson) {
          const tr = String(rawHtmlOrJson).trim();
          if (tr.startsWith('{')) { const p = JSON.parse(tr); if (p.html) html = p.html; }
          else if (tr.includes('<html')) html = tr;
        }
        html = sanitizeHtmlForGitHubUpload(html);
        await pushSingleFileToGitHub(repo, branch, state.githubFilePath || 'ota.json', JSON.stringify({ version: ver, html }, null, 2), `🏷️ Release ${tagName}`, token);
        await pushSingleFileToGitHub(repo, branch, 'index.html', html, `🏷️ index.html ${tagName}`, token);
        await pushStateToGitHubCloud(false);
        let relId = null;
        try { const cr = await fetch(`https://api.github.com/repos/${repo}/releases/tags/${encodeURIComponent(tagName)}?t=${Date.now()}`, { headers, cache: 'no-store' }); if (cr.ok) { const rj = await cr.json(); if (rj && rj.id) relId = rj.id; } } catch (e) {}
        const relPayload = { tag_name: tagName, target_commitish: branch, name: `Krono Finanzas ${tagName}`, body: customNotes || ui.releaseNotesInput || `Release ${tagName}`, draft: false, prerelease: false };
        const relRes = await fetch(relId ? `https://api.github.com/repos/${repo}/releases/${relId}` : `https://api.github.com/repos/${repo}/releases`, { method: relId ? 'PATCH' : 'POST', headers, body: JSON.stringify(relPayload) });
        if (!relRes.ok) throw new Error('Release HTTP ' + relRes.status);
        localStorage.setItem('KRONO_AUTO_DEPLOYED_VER', ver);
        ui.githubPushing = false; ui.otaStatusMsg = `✅ Release ${tagName} publicado en GitHub.`;
        spawnFloatingBurst(`🏷️ Subido ${tagName}`, true); render(); return true;

    }

    function getTotals() {
      const rate = Number(state.exchangeRate) || 41.5;
      let totalUYU = 0, monthIncomeUYU = 0, monthExpenseUYU = 0;
      state.accounts.forEach(a => { totalUYU += a.currency === 'USD' ? a.balance * rate : a.balance; });
      state.transactions.forEach(t => { const v = t.currency === 'USD' ? t.amount * rate : t.amount; if (t.type === 'income') monthIncomeUYU += v; else monthExpenseUYU += v; });
      return { totalUYU, totalUSD: totalUYU / rate, monthIncomeUYU, monthExpenseUYU, savingsRate: monthIncomeUYU > 0 ? Math.max(0, Math.round(((monthIncomeUYU - monthExpenseUYU) / monthIncomeUYU) * 100)) : 0 };
    }
    function formatMoney(amount, currency = 'UYU') { return (currency === 'USD' ? 'US$ ' : '$ ') + Number(amount || 0).toLocaleString('es-UY', { maximumFractionDigits: currency === 'USD' ? 2 : 0 }); }
    function addTransaction({ title, amount, currency = 'UYU', type = 'expense', category = 'Comida y Súper', accountId = null, fromExternal = false }) {
      const numAmount = Math.abs(Number(amount) || 0); if (numAmount <= 0) return null;
      const rate = Number(state.exchangeRate) || 41.5;
      const normTitle = normalizeStr(title || '');
      const isSavingsIntent = /\b(ahorr[eo]|ahorrar|ahorro|pase a ahorro|reserve|reservar)\b/i.test(normTitle);

      let targetAcc = state.accounts.find(a => a.id === accountId) || state.accounts[0];
      if (isSavingsIntent) {
        const savAcc = pickBestAccountForCurrency(currency, true);
        if (savAcc) targetAcc = savAcc;
        const originAcc = pickOriginAccountForSavings(targetAcc);
        if (originAcc && targetAcc && originAcc.id !== targetAcc.id) {
          const outInOriginCur = (originAcc.currency === currency)
            ? numAmount
            : (currency === 'USD' && originAcc.currency === 'UYU' ? numAmount * rate : numAmount / rate);
          const inTargetCur = (targetAcc.currency === currency)
            ? numAmount
            : (currency === 'USD' && targetAcc.currency === 'UYU' ? numAmount * rate : numAmount / rate);
          originAcc.balance = Number((originAcc.balance - outInOriginCur).toFixed(2));
          targetAcc.balance = Number((targetAcc.balance + inTargetCur).toFixed(2));
        } else if (targetAcc) {
          const delta = numAmount;
          if (targetAcc.currency === currency) targetAcc.balance += delta;
          else if (currency === 'USD' && targetAcc.currency === 'UYU') targetAcc.balance += delta * rate;
          else if (currency === 'UYU' && targetAcc.currency === 'USD') targetAcc.balance += delta / rate;
        }
      } else if (targetAcc) {
        const delta = type === 'income' ? numAmount : -numAmount;
        if (targetAcc.currency === currency) targetAcc.balance += delta;
        else if (currency === 'USD' && targetAcc.currency === 'UYU') targetAcc.balance += delta * rate;
        else if (currency === 'UYU' && targetAcc.currency === 'USD') targetAcc.balance += delta / rate;
      }

      const now = new Date();
      const originRef = isSavingsIntent ? pickOriginAccountForSavings(targetAcc) : null;
      const accDisplay = (isSavingsIntent && originRef && targetAcc && originRef.id !== targetAcc.id)
        ? `${originRef.name} → ${targetAcc.name}`
        : (targetAcc ? targetAcc.name : 'Cuenta Principal');
      const tx = {
        id: 'tx_' + Date.now() + '_' + Math.floor(Math.random() * 1000),
        title: (fromExternal ? '🤖 ' : '') + (title || 'Movimiento'),
        amount: numAmount,
        currency,
        type: isSavingsIntent ? 'expense' : type,
        category: isSavingsIntent ? 'Ahorro' : category,
        accountId: targetAcc ? targetAcc.id : 'acc_uyu',
        accountName: accDisplay,
        date: `${String(now.getDate()).padStart(2,'0')}/${String(now.getMonth()+1).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`,
        timestamp: Date.now()
      };
      state.transactions.unshift(tx);
      spawnFloatingBurst(`${tx.type === 'income' ? '+' : '-'}${formatMoney(numAmount, currency)} (${targetAcc ? targetAcc.name.split(' ')[0] : ''})`, tx.type === 'income');
      saveState(true, true);
      return tx;
    }

    function resolveMatchingAccountForTx(tx) {
      if (!tx || !Array.isArray(state.accounts) || !state.accounts.length) return null;
      if (tx.accountId) {
        const byId = state.accounts.find(a => String(a.id) === String(tx.accountId));
        if (byId) return byId;
      }
      const rawAccName = String(tx.accountName || '').trim();
      const normAccName = normalizeStr(rawAccName);
      if (normAccName) {
        const byExact = state.accounts.find(a => normalizeStr(a.name) === normAccName);
        if (byExact) return byExact;
        const byIncludes = state.accounts.find(a => {
          const aN = normalizeStr(a.name);
          return (aN && normAccName.includes(aN)) || (aN && aN.includes(normAccName));
        });
        if (byIncludes) return byIncludes;
        const byMention = findAccountMentionInText(rawAccName);
        if (byMention) return byMention;
      }
      const cleanTitle = String(tx.title || '').trim();
      if (cleanTitle) {
        const byTitle = findAccountMentionInText(cleanTitle);
        if (byTitle) return byTitle;
      }
      return state.accounts.find(a => a.currency === (tx.currency || 'UYU')) || state.accounts[0];
    }

    function applyTxEffectToAccounts(tx, multiplier = 1) {
      if (!tx) return null;
      const rate = Number(state.exchangeRate) || 41.5;
      const amt = Math.abs(Number(tx.amount) || 0) * multiplier;
      if (amt <= 0) return null;
      const cur = tx.currency || 'UYU';

      // Check if it was a savings move between two accounts ("Origen → Destino")
      if (tx.category === 'Ahorro' && typeof tx.accountName === 'string' && tx.accountName.includes(' → ')) {
        const parts = tx.accountName.split(' → ');
        const originName = normalizeStr(parts[0] || '');
        const destName = normalizeStr(parts[1] || '');
        const originAcc = state.accounts.find(a => normalizeStr(a.name) === originName) || findAccountMentionInText(parts[0] || '');
        const destAcc = state.accounts.find(a => normalizeStr(a.name) === destName) || findAccountMentionInText(parts[1] || '') || state.accounts.find(a => a.id === tx.accountId);
        if (originAcc && destAcc && originAcc.id !== destAcc.id) {
          const outInOrigin = (originAcc.currency === cur) ? amt : (cur === 'USD' && originAcc.currency === 'UYU' ? amt * rate : amt / rate);
          const inDest = (destAcc.currency === cur) ? amt : (cur === 'USD' && destAcc.currency === 'UYU' ? amt * rate : amt / rate);
          originAcc.balance = Number((originAcc.balance - outInOrigin).toFixed(2));
          destAcc.balance = Number((destAcc.balance + inDest).toFixed(2));
          return destAcc;
        }
      }

      const acc = resolveMatchingAccountForTx(tx);
      if (acc) {
        const signed = (tx.type === 'income' ? 1 : -1) * amt;
        if (acc.currency === cur) acc.balance = Number((acc.balance + signed).toFixed(2));
        else if (cur === 'USD' && acc.currency === 'UYU') acc.balance = Number((acc.balance + signed * rate).toFixed(2));
        else if (cur === 'UYU' && acc.currency === 'USD') acc.balance = Number((acc.balance + signed / rate).toFixed(2));
        return acc;
      }
      return null;
    }

    function handleEditTransactionSubmit(e) {
      if (e) e.preventDefault();
      const idx = (state.transactions || []).findIndex(t => t.id === ui.editingTxId);
      if (idx === -1) return;
      const oldTx = state.transactions[idx];
      const newTitle = (document.getElementById('etx-title').value || '').trim() || 'Movimiento';
      const newAmount = Math.abs(parseFloat(document.getElementById('etx-amount').value) || 0);
      if (!newAmount || newAmount <= 0) return;
      const newCurrency = document.getElementById('etx-currency').value || 'UYU';
      const newType = document.getElementById('etx-type').value || 'expense';
      const newCategory = document.getElementById('etx-category').value || 'General';
      const newAccId = document.getElementById('etx-account').value;
      const targetAcc = state.accounts.find(a => a.id === newAccId) || state.accounts[0];

      // Revert old effect from accounts first
      applyTxEffectToAccounts(oldTx, -1);

      const updatedTx = {
        ...oldTx,
        title: newTitle,
        amount: newAmount,
        currency: newCurrency,
        type: newType,
        category: newCategory,
        accountId: targetAcc ? targetAcc.id : oldTx.accountId,
        accountName: targetAcc ? targetAcc.name : oldTx.accountName
      };

      // Apply new effect to accounts
      applyTxEffectToAccounts(updatedTx, 1);
      state.transactions[idx] = updatedTx;
      ui.editingTxId = null;
      spawnFloatingBurst(`✏️ ${updatedTx.title} (${formatMoney(updatedTx.amount, updatedTx.currency)})`, updatedTx.type === 'income');
      saveState(true, true);
    }

    function deleteTransaction(txId) {
      const idx = state.transactions.findIndex(t => t.id === txId); if (idx === -1) return;
      const tx = state.transactions[idx];

    function getDebtRemainingAmount(d) {
      const total = Math.max(0, Number(d.amount || 0));
      const instCount = Math.max(1, parseInt(d.installmentsCount, 10) || 1);
      const paidInst = Math.max(0, Math.min(instCount, parseInt(d.paidInstallments, 10) || 0));
      if (instCount > 1) {
        const perInst = total / instCount;
        const remInst = Math.max(0, instCount - paidInst);
        return Number((perInst * remInst).toFixed(2));
      }
      return total;
    }
    function getDebtInstallmentValue(d) {
      const total = Math.max(0, Number(d.amount || 0));
      const instCount = Math.max(1, parseInt(d.installmentsCount, 10) || 1);
      return Number((total / instCount).toFixed(2));
    }
    function getDebtInstrumentLabel(d) {
      const explicitCard = (d.cardName || '').trim();
      if (explicitCard) return explicitCard;
      const cp = (d.counterparty || '').trim();

      return '';

    function isTempIncreaseActive(inc) {
      if (!inc) return false;
      const amt = Math.max(0, Number(inc.amount) || 0);
      if (amt <= 0) return false;
      if (!inc.expiresAt) return true;
      const expStr = String(inc.expiresAt).trim();
      if (!expStr) return true;
      // Support YYYY-MM-DD or DD/MM/YYYY
      let expDate = null;
      if (/^\d{4}-\d{2}-\d{2}$/.test(expStr)) {
        const [y, m, d] = expStr.split('-').map(Number);
        expDate = new Date(y, m - 1, d, 23, 59, 59, 999);
      } else if (/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(expStr)) {
        const [d, m, y] = expStr.split('/').map(Number);
        expDate = new Date(y, m - 1, d, 23, 59, 59, 999);
      } else {
        const parsed = Date.parse(expStr);
        if (!isNaN(parsed)) expDate = new Date(parsed);
      }
      if (!expDate || isNaN(expDate.getTime())) return true;
      return Date.now() <= expDate.getTime();
    }

    function getActiveTempLimitIncrease(cardObj, rate = 41.5) {
      if (!cardObj || !Array.isArray(cardObj.tempLimitIncreases)) return 0;
      const cardCur = cardObj.currency || 'UYU';
      let maxTargetInCardCur = 0;
      for (const inc of cardObj.tempLimitIncreases) {
        if (!isTempIncreaseActive(inc)) continue;
        const amt = Math.max(0, Number(inc.amount) || 0);
        const incCur = inc.currency || cardCur;
        let inCard = amt;
        if (incCur === 'USD' && cardCur === 'UYU') inCard = amt * rate;
        else if (incCur === 'UYU' && cardCur === 'USD') inCard = amt / rate;
        if (inCard > maxTargetInCardCur) maxTargetInCardCur = inCard;
      }
      return Number(maxTargetInCardCur.toFixed(2));
    }

    function getEffectiveCardLimit(cardObj, rate = 41.5) {
      if (!cardObj) return 0;
      const baseLim = Math.max(0, Number(cardObj.creditLimit) || 0);
      const tempTarget = getActiveTempLimitIncrease(cardObj, rate);
      if (tempTarget > 0) {
        return Number(Math.max(baseLim, tempTarget).toFixed(2));
      }
      return Number(baseLim.toFixed(2));
    }

    function addTemporaryCardLimitIncrease(cardId, amount, expiresAt = '', note = '') {

    function removeTemporaryCardLimitIncrease(cardId, incId) {

    function getDebtsCardsBreakdown() {
      const rate = Number(state.exchangeRate) || 41.5;
      const list = Array.isArray(state.debts) ? state.debts : [];
      const savedCards = Array.isArray(state.creditCards) ? state.creditCards : [];
      const map = new Map();
      savedCards.forEach(sc => {
        const label = (sc.name || '').trim();
        if (!label) return;
        const key = label.toLowerCase();
        const baseLim = Math.max(0, Number(sc.creditLimit) || 0);
        const tempTarget = getActiveTempLimitIncrease(sc, rate);
        const effLim = getEffectiveCardLimit(sc, rate);
        const tempExtraDiff = Math.max(0, Number((effLim - baseLim).toFixed(2)));
        const activeTempList = Array.isArray(sc.tempLimitIncreases) ? sc.tempLimitIncreases.filter(isTempIncreaseActive) : [];
        if (!map.has(key)) {
          map.set(key, {
            id: sc.id,
            name: label,
            currency: sc.currency || 'UYU',
            baseLimit: baseLim,
            tempTargetLimit: tempTarget,
            tempLimitIncrease: tempExtraDiff,
            activeTempIncreasesCount: activeTempList.length,
            effectiveLimit: effLim,
            closingDay: sc.closingDay || '',
            dueDay: sc.dueDay || '',
            totalItems: 0,
            pendingItems: 0,
            activeInstallmentPlans: 0,
            remainingInstallmentsTotal: 0,
            nextPaymentUYU: 0,
            remainingBalanceUYU: 0,
            dueDates: sc.dueDay ? ['Día ' + sc.dueDay] : []
          });
        }
      });
      list.forEach(d => {
        const cardLabel = getDebtInstrumentLabel(d);
        if (!cardLabel) return;
        const key = cardLabel.toLowerCase();
        if (!map.has(key)) {
          map.set(key, {
            name: cardLabel,
            currency: d.currency || 'UYU',
            baseLimit: 0,
            tempLimitIncrease: 0,
            activeTempIncreasesCount: 0,
            effectiveLimit: 0,
            totalItems: 0,
            pendingItems: 0,
            activeInstallmentPlans: 0,
            remainingInstallmentsTotal: 0,
            nextPaymentUYU: 0,
            remainingBalanceUYU: 0,
            dueDates: []
          });
        }
        const entry = map.get(key);
        entry.totalItems++;
        if (d.status !== 'settled') {
          entry.pendingItems++;
          const rem = getDebtRemainingAmount(d);
          const instCount = Math.max(1, parseInt(d.installmentsCount, 10) || 1);
          const paidInst = Math.max(0, Math.min(instCount, parseInt(d.paidInstallments, 10) || 0));
          const remInst = Math.max(0, instCount - paidInst);
          const instVal = getDebtInstallmentValue(d);
          const payNow = instCount > 1 ? Math.min(rem, instVal) : rem;
          const sign = d.kind === 'credit' ? -1 : 1;
          entry.remainingBalanceUYU += sign * (d.currency === 'USD' ? rem * rate : rem);
          entry.nextPaymentUYU += sign * (d.currency === 'USD' ? payNow * rate : payNow);
          if (instCount > 1) {
            entry.activeInstallmentPlans++;
            entry.remainingInstallmentsTotal += remInst;
          }
          if (d.dueDate && !entry.dueDates.includes(d.dueDate)) {
            entry.dueDates.push(d.dueDate);
          }
        }
      });
      return Array.from(map.values()).map(entry => {
        const cardCur = entry.currency || 'UYU';
        const usedInCardCur = cardCur === 'USD'
          ? Number((Math.max(0, entry.remainingBalanceUYU) / rate).toFixed(2))
          : Math.max(0, entry.remainingBalanceUYU);
        const effLim = Math.max(0, Number(entry.effectiveLimit) || 0);
        const availLim = effLim > 0 ? Number((effLim - usedInCardCur).toFixed(2)) : null;
        const usedPct = effLim > 0 ? Math.min(100, Math.max(0, Math.round((usedInCardCur / effLim) * 100))) : 0;
        return {
          ...entry,
          usedInCardCur,
          availableLimit: availLim,
          usedPct
        };
      });
    }
    function parseClosingDayNumber(rawVal) {
      if (rawVal === null || rawVal === undefined) return null;
      const m = String(rawVal).match(/(\d{1,2})/);
      if (!m) return null;
      const day = parseInt(m[1], 10);
      return (day >= 1 && day <= 31) ? day : null;
    }
    function makeClampedMonthDate(year, monthIdx, day, endOfDay = false) {
      const lastDay = new Date(year, monthIdx + 1, 0).getDate();
      const clamped = Math.max(1, Math.min(day, lastDay));
      return endOfDay
        ? new Date(year, monthIdx, clamped, 23, 59, 59, 999)
        : new Date(year, monthIdx, clamped, 0, 0, 0, 0);
    }
    function getCardClosingCycleDates(closingDay, now = new Date()) {
      const y = now.getFullYear(), m = now.getMonth();
      if (closingDay && closingDay >= 1 && closingDay <= 31) {
        const thisMonthClose = makeClampedMonthDate(y, m, closingDay, true);
        if (now.getDate() >= closingDay) {
          return {
            hasClosingDay: true,
            currentClosingDate: thisMonthClose,
            nextClosingDate: makeClampedMonthDate(y, m + 1, closingDay, true)
          };
        }
        return {
          hasClosingDay: true,
          currentClosingDate: makeClampedMonthDate(y, m - 1, closingDay, true),
          nextClosingDate: thisMonthClose
        };
      }
      return {
        hasClosingDay: false,
        currentClosingDate: new Date(y, m, 0, 23, 59, 59, 999),
        nextClosingDate: new Date(y, m + 1, 0, 23, 59, 59, 999)
      };
    }
    function formatShortDayMonth(dateObj) {
      if (!dateObj || isNaN(dateObj.getTime())) return '';
      return `${String(dateObj.getDate()).padStart(2, '0')}/${String(dateObj.getMonth() + 1).padStart(2, '0')}`;
    }
    function formatCardClosingAndDueDates(cardObj, now = new Date()) {
      if (!cardObj) return '';
      const rawClose = String(cardObj.closingDay || '').trim();
      const rawDue = String(cardObj.dueDay || '').trim();
      const closeDay = parseClosingDayNumber(rawClose);
      const dueDay = parseClosingDayNumber(rawDue);
      const y = now.getFullYear(), m = now.getMonth();
      const parts = [];
      let closeDateObj = null;

      if (rawClose) {
        if (/^\d{1,2}\/\d{1,2}/.test(rawClose)) {
          parts.push('Cierre ' + rawClose);
        } else if (closeDay) {
          const thisMonthClose = makeClampedMonthDate(y, m, closeDay, true);
          closeDateObj = (now.getTime() <= thisMonthClose.getTime())
            ? thisMonthClose
            : makeClampedMonthDate(y, m + 1, closeDay, true);
          parts.push('Cierre ' + formatShortDayMonth(closeDateObj));
        } else {
          parts.push('Cierre ' + rawClose);
        }
      }

      if (rawDue) {
        if (/^\d{1,2}\/\d{1,2}/.test(rawDue)) {
          parts.push('Vto. ' + rawDue);
        } else if (dueDay) {
          let dueDateObj = null;
          if (closeDateObj && closeDay) {
            const dueMonthOffset = (dueDay > closeDay) ? 0 : 1;
            dueDateObj = makeClampedMonthDate(closeDateObj.getFullYear(), closeDateObj.getMonth() + dueMonthOffset, dueDay, true);
          } else {
            const thisMonthDue = makeClampedMonthDate(y, m, dueDay, true);
            dueDateObj = (now.getTime() <= thisMonthDue.getTime())
              ? thisMonthDue
              : makeClampedMonthDate(y, m + 1, dueDay, true);
          }
          parts.push('Vto. ' + formatShortDayMonth(dueDateObj));
        } else {
          parts.push('Vto. ' + rawDue);
        }
      }

      return parts.join(' • ');
    }
    function autoFillNewTxCardDates(cardNameValue) {
      const dueInput = document.getElementById('tx-due');
      if (!dueInput) return;
      const cleanName = String(cardNameValue || '').trim().toLowerCase();
      if (!cleanName) {
        if (dueInput.dataset.autofilled === '1') {
          dueInput.value = '';
          delete dueInput.dataset.autofilled;
        }
        return;
      }
      const cards = Array.isArray(state.creditCards) ? state.creditCards : [];
      const card = cards.find(c => String(c.name || '').trim().toLowerCase() === cleanName);
      if (!card) {
        if (dueInput.dataset.autofilled === '1') {
          dueInput.value = '';
          delete dueInput.dataset.autofilled;
        }
        return;
      }
      const formatted = formatCardClosingAndDueDates(card, new Date());
      if (formatted) {
        dueInput.value = formatted;
        dueInput.dataset.autofilled = '1';
      } else if (dueInput.dataset.autofilled === '1') {
        dueInput.value = '';
        delete dueInput.dataset.autofilled;
      }
    }
    function getSavedCardMetaForDebt(d) {
      const cards = Array.isArray(state.creditCards) ? state.creditCards : [];
      if (!cards.length || !d) return null;
      const label = normalizeStr(getDebtInstrumentLabel(d) || d.cardName || d.counterparty || '');
      if (!label) return null;
      return cards.find(c => {
        const cn = normalizeStr(c.name || '');
        return cn && (cn === label || label.includes(cn) || cn.includes(label));
      }) || null;
    }
    function wasDebtPaidAfterTimestamp(d, cardMeta, cutoffMs) {
      const lastPaid = Number(d && d.lastPaidAt) || 0;
      if (lastPaid > cutoffMs) return true;
      const paidInst = Math.max(0, parseInt(d && d.paidInstallments, 10) || 0);
      if (paidInst <= 0) return false;
      const txs = Array.isArray(state.transactions) ? state.transactions : [];
      const dTitleNorm = normalizeStr((d && d.title) || '');
      const cardNorm = normalizeStr((cardMeta && cardMeta.name) || (d && d.cardName) || '');
      return txs.some(tx => {
        if (!tx || tx.type !== 'expense') return false;
        const ts = Number(tx.timestamp) || 0;
        if (ts <= cutoffMs) return false;
        const tNorm = normalizeStr(tx.title || '');
        if (dTitleNorm && /^(?:🤖\s*)?pago\s*:/.test(tNorm) && tNorm.includes(dTitleNorm)) return true;
        if (/^(?:🤖\s*)?(?:cuotas del mes|saldo total|pago\s+tarjeta)/.test(tNorm)) {
          if (!cardNorm || tNorm.includes(cardNorm) || normalizeStr(tx.accountName || '').includes(cardNorm)) return true;
        }
        return false;
      });
    }
    function getDebtsSummary() {
      const rate = Number(state.exchangeRate) || 41.5;
      const list = Array.isArray(state.debts) ? state.debts : [];
      const now = new Date();
      let pendingCreditsUYU = 0, pendingDebtsUYU = 0, pendingCount = 0, nextInstallmentsUYU = 0;
      list.forEach(d => {
        if (d.status !== 'settled') {
          pendingCount++;
          const rem = getDebtRemainingAmount(d);
          const v = (d.currency === 'USD' ? rem * rate : rem);
          const instVal = getDebtInstallmentValue(d);
          const instV = (d.currency === 'USD' ? instVal * rate : instVal);
          if (d.kind === 'credit') {
            pendingCreditsUYU += v;
          } else {
            pendingDebtsUYU += v;
            nextInstallmentsUYU += instV;
          }
        }
      });
      let currentCardClosingUYU = 0, nextCardClosingUYU = 0;
      let currentClosingDateObj = null, nextClosingDateObj = null;
      list.forEach(d => {
        if (d.status !== 'settled' && d.kind !== 'credit') {
          const cardMeta = getSavedCardMetaForDebt(d);
          const hasCard = Boolean(cardMeta) || d.paymentMethod === 'credit_card' || Boolean((d.cardName || '').trim()) || /tarjeta|visa|master|oca|amex|cabal|zodimac|brou|itau|itaú|santander|bbva|scotia|prex|midinero/i.test(`${d.title || ''} ${d.counterparty || ''}`);
          if (hasCard) {
            const rem = getDebtRemainingAmount(d);
            const instCount = Math.max(1, parseInt(d.installmentsCount, 10) || 1);
            const paidInst = Math.max(0, Math.min(instCount, parseInt(d.paidInstallments, 10) || 0));
            const remInst = Math.max(1, instCount - paidInst);
            const instVal = getDebtInstallmentValue(d);
            const payClosing = instCount > 1 ? Math.min(rem, instVal) : rem;
            const payClosingUYU = (d.currency === 'USD' ? payClosing * rate : payClosing);

            const closingDay = parseClosingDayNumber(cardMeta ? cardMeta.closingDay : null);
            const cycle = getCardClosingCycleDates(closingDay, now);
            const createdMs = Number(d.createdAt) || 0;
            const inCurrentClosing = cycle.hasClosingDay ? (createdMs <= cycle.currentClosingDate.getTime()) : true;
            const paidCurrentCycle = wasDebtPaidAfterTimestamp(d, cardMeta, cycle.currentClosingDate.getTime());

            if (inCurrentClosing && !paidCurrentCycle) {
              currentCardClosingUYU += payClosingUYU;
              if (cycle.hasClosingDay && (!currentClosingDateObj || cycle.currentClosingDate < currentClosingDateObj)) {
                currentClosingDateObj = cycle.currentClosingDate;
              }
              if (instCount > 1 && remInst > 1) {
                const remAfterCurrent = Math.max(0, rem - payClosing);
                const nextPay = Math.min(remAfterCurrent, instVal);
                nextCardClosingUYU += (d.currency === 'USD' ? nextPay * rate : nextPay);
                if (cycle.hasClosingDay && (!nextClosingDateObj || cycle.nextClosingDate < nextClosingDateObj)) {
                  nextClosingDateObj = cycle.nextClosingDate;
                }
              }
            } else {
              nextCardClosingUYU += payClosingUYU;
              if (cycle.hasClosingDay && (!nextClosingDateObj || cycle.nextClosingDate < nextClosingDateObj)) {
                nextClosingDateObj = cycle.nextClosingDate;
              }
            }
          }

      const hasPendingCurrentClosing = currentCardClosingUYU > 0.01;
      const cardClosingMode = hasPendingCurrentClosing ? 'current' : 'next';

      const activeClosingDate = hasPendingCurrentClosing ? currentClosingDateObj : nextClosingDateObj;
      const cardClosingDateLabel = activeClosingDate ? formatShortDayMonth(activeClosingDate) : '';
      return {
        pendingCreditsUYU,
        pendingDebtsUYU,

    function pickBestAccountForCurrency(currency, preferSavings = false) {
      const accs = Array.isArray(state.accounts) ? state.accounts : [];
      if (!accs.length) return null;
      if (preferSavings) {
        const sav = accs.find(a => a.currency === currency && /ahorro|saving|usd|dolares|dólares/i.test(String(a.name || '')))
          || accs.find(a => /ahorro|saving/i.test(String(a.name || '')))
          || accs.find(a => a.currency === currency);
        if (sav) return sav;
      }
      return accs.find(a => a.currency === currency) || accs[0];
    }

    function pickOriginAccountForSavings(targetSavingsAcc) {
      const accs = Array.isArray(state.accounts) ? state.accounts : [];
      if (!accs.length) return null;
      const others = accs.filter(a => !targetSavingsAcc || a.id !== targetSavingsAcc.id);
      if (targetSavingsAcc && targetSavingsAcc.currency === 'USD') {
        return others.find(a => a.currency === 'UYU' && /brou|debito|débito|banco|cuenta/i.test(String(a.name || '')))
          || others.find(a => a.currency === 'UYU')
          || others[0]
          || targetSavingsAcc;
      }
      return others.find(a => /brou|debito|débito|banco|efectivo|billetera/i.test(String(a.name || '')))
        || others[0]
        || targetSavingsAcc;
    }

    function payNextDebtInstallment(id, recordTx = true) {
      const list = Array.isArray(state.debts) ? state.debts : [];
      const d = list.find(x => x.id === id); if (!d || d.status === 'settled') return;
      const instCount = Math.max(1, parseInt(d.installmentsCount, 10) || 1);
      const paidInst = Math.max(0, parseInt(d.paidInstallments, 10) || 0);
      const instVal = getDebtInstallmentValue(d);
      const remBefore = getDebtRemainingAmount(d);
      const payVal = Math.min(remBefore, instVal || remBefore);
      const nextPaid = Math.min(instCount, paidInst + 1);
      const isCredit = d.kind === 'credit';
      const actionVerb = isCredit ? 'cobrar' : 'pagar';
      const linkedAcc = pickBestAccountForCurrency(d.currency, false);
      const accName = linkedAcc ? linkedAcc.name : 'cuenta principal';
      const flowNote = recordTx
        ? (isCredit
            ? ` se sumará a "${escapeAttr(accName)}"`
            : ` saldrá de "${escapeAttr(accName)}"`)
        : ' sin asentar en cuenta';

      openConfirmModal({
        title: `💳 Confirmar ${isCredit ? 'Cobro' : 'Pago'} de Cuota #${nextPaid}/${instCount}`,
        message: `¿Querés ${actionVerb} la cuota #${nextPaid} de "${escapeAttr(d.title)}" por ${formatMoney(payVal, d.currency)} y que${flowNote}?`,
        confirmText: recordTx ? `Confirmar y Asentar` : `Marcar Cuota Pagada`,
        danger: false,
        onConfirm: () => {
          d.paidInstallments = nextPaid;
          d.lastPaidAt = Date.now();
          if (nextPaid >= instCount || getDebtRemainingAmount(d) <= 0.01) {
            d.status = 'settled';
            d.settledAt = Date.now();
          }
          if (recordTx && payVal > 0) {
            const cardTag = d.cardName ? ` [${d.cardName}]` : '';
            const cuotaTag = instCount > 1 ? ` (Cuota ${nextPaid}/${instCount})` : '';
            addTransaction({
              title: `${isCredit ? 'Cobro' : 'Pago'}: ${d.title}${cuotaTag}${cardTag}`,
              amount: payVal,
              currency: d.currency,
              type: isCredit ? 'income' : 'expense',
              category: isCredit ? 'Ingreso' : (d.paymentMethod === 'credit_card' ? 'Tarjeta de Crédito' : 'General'),
              accountId: linkedAcc ? linkedAcc.id : null
            });
            spawnFloatingBurst(`✅ ${instCount > 1 ? 'Cuota ' + nextPaid + '/' + instCount + ' asentada' : 'Liquidado y asentado'}`, isCredit);
            return;
          }
          spawnFloatingBurst(nextPaid >= instCount ? '✅ Todas las cuotas saldadas' : `✅ Cuota ${nextPaid}/${instCount} marcada`, true);
          saveState(true, true);
        }
      });
    }

      d.kind = kind;
      d.paymentMethod = paymentMethod;
      d.cardName = cardName;
      const prevPaidInst = Math.max(0, parseInt(d.paidInstallments, 10) || 0);

    const GEMINI_MODEL_PRIORITY = [
      'gemini-2.5-flash',

    async function discoverGeminiModelsForKey(cleanKey) {
      const cachedListRaw = sessionStorage.getItem('KRONO_DISCOVERED_GEMINI_MODELS');
      if (cachedListRaw) {
        try {
          const parsed = JSON.parse(cachedListRaw);
          if (Array.isArray(parsed) && parsed.length) return parsed;
        } catch (e) {}
      }
      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${encodeURIComponent(cleanKey)}`, { cache: 'no-store' });
        if (!res.ok) return GEMINI_MODEL_PRIORITY.slice();
        const data = await res.json();
        const available = (data.models || [])
          .filter(m => Array.isArray(m.supportedGenerationMethods) && m.supportedGenerationMethods.includes('generateContent'))
          .map(m => String(m.name || '').replace(/^models\//, ''))
          .filter(name => name && name.includes('gemini') && !/embedding|imagen|veo|tts|audio|robotics|computer-use|deep-research|thinking/i.test(name));

        if (!available.length) return GEMINI_MODEL_PRIORITY.slice();

        const ordered = [];
        for (const pref of GEMINI_MODEL_PRIORITY) {
          if (available.includes(pref) && !ordered.includes(pref)) ordered.push(pref);
        }
        for (const name of available) {
          if (/flash/i.test(name) && !/3\.8/i.test(name) && !ordered.includes(name)) ordered.push(name);
        }
        for (const name of available) {
          if (!ordered.includes(name)) ordered.push(name);
        }
        sessionStorage.setItem('KRONO_DISCOVERED_GEMINI_MODELS', JSON.stringify(ordered));
        return ordered;
      } catch (e) {
        return GEMINI_MODEL_PRIORITY.slice();
      }
    }

    function resolveBestGeminiModelFast() {
      const cached = (localStorage.getItem('KRONO_GEMINI_MODEL') || '').trim();
      if (cached && !/3\.8/i.test(cached)) return cached;
      return GEMINI_MODEL_PRIORITY[0];
    }

    async function callSingleGeminiModel(modelName, compactPrompt, cleanKey) {
      const controller = ('AbortController' in window) ? new AbortController() : null;
      const timer = controller ? setTimeout(() => controller.abort(), 14000) : null;
      try {
        const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${encodeURIComponent(cleanKey)}`;
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          signal: controller ? controller.signal : undefined,
          body: JSON.stringify({
            contents: [{ role: 'user', parts: [{ text: compactPrompt }] }],
            generationConfig: {
              temperature: 0,
              maxOutputTokens: 512,
              responseMimeType: 'application/json'
            }
          })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          const apiErr = (data && data.error && data.error.message) ? data.error.message : `HTTP ${res.status}`;
          const err = new Error(`${modelName}: ${apiErr}`);
          err.status = res.status;
          throw err;
        }
        const rawText = data?.candidates?.[0]?.content?.parts?.[0]?.text || '';
        if (!rawText.trim()) {
          throw new Error(`${modelName}: respuesta vacía`);
        }
        const cleanedJson = rawText.replace(/^```json\s*|\s*```$/gi, '').trim();
        const parsed = JSON.parse(cleanedJson);
        if (!Array.isArray(parsed.actions)) {
          throw new Error(`${modelName}: JSON sin actions`);
        }
        return parsed.actions;
      } finally {
        if (timer) clearTimeout(timer);
      }
    }

      }

        'Traducí la frase financiera en español a JSON {"actions":[...]} para Krono Finanzas.',
        'Operaciones válidas:',
        '1) Gasto o ingreso al contado: {"op":"add_transaction","title":"...","amount":1500,"currency":"UYU|USD","type":"expense|income","category":"Comida y Súper|Servicios y Luz|Transporte y Nafta|Ahorro|Ingreso|General","accountQuery":"nombre de cuenta o vacío"}',
        '2) Compra con tarjeta o préstamo: {"op":"add_debt","title":"...","amount":1500,"currency":"UYU|USD","kind":"debt|credit","paymentMethod":"credit_card|personal","cardName":"nombre tarjeta","counterparty":"persona/comercio","installmentsCount":1,"perInstallment":false}',
        '   - REGLA CRÍTICA DE kind: Si el usuario dice "gasté ... en crédito", "compré a crédito", "tarjeta de crédito" o "en cuotas" (él pagó/compró), SIEMPRE es kind="debt" y paymentMethod="credit_card" (es algo que el usuario DEBE pagar).',
        '   - Usá kind="credit" ÚNICAMENTE cuando al usuario le deben dinero ("me deben", "presté plata a...", "por cobrar").',
        '3) Pago de tarjeta, cuotas o deuda: {"op":"pay_obligations","scope":"current_installments|full_balance|exact_amount","cardQuery":"nombre tarjeta o vacío","accountQuery":"cuenta origen","amount":0,"currency":"UYU|USD"}',
        '   - Sin decir "todo" ni "saldo total": scope="current_installments".',
        '   - Solo usá scope="full_balance" si dice explícitamente "todo" o "saldo total".',
        '4) Consulta de saldo o patrimonio: {"op":"query_balance","accountQuery":"nombre cuenta o vacío"}',
        `Contexto:${JSON.stringify(ctx)}`,
        `Frase:"${commandText}"`
      ].join('\n');

      const discovered = await discoverGeminiModelsForKey(cleanKey);
      const preferred = resolveBestGeminiModelFast();
      const orderedModels = [
        ...(discovered.includes(preferred) ? [preferred] : []),
        ...discovered.filter(m => m !== preferred)
      ];

      let lastError = null;
      for (let attempt = 0; attempt < 2; attempt++) {
        for (const modelName of orderedModels) {
          try {
            const actions = await callSingleGeminiModel(modelName, compactPrompt, cleanKey);
            localStorage.setItem('KRONO_GEMINI_MODEL', modelName);

    function executeStructuredActions(actions, originalText, fromExternal) {
      if (!Array.isArray(actions) || !actions.length) return false;
      if (!Array.isArray(state.debts)) state.debts = [];
      const rate = Number(state.exchangeRate) || 41.5;
      const summaryParts = [];
      let executedAny = false;

      function matchAccount(q, preferredCurrency = null) {
        const nq = normalizeStr(q || '');
        if (nq) {
          if (/\b(efectivo|billetera|cash|contado|en mano|monedero|plata)\b/.test(nq)) {
            return state.accounts.find(a => a.id === 'acc_cash' || /efectivo|billetera|cash|mano/i.test(normalizeStr(a.name))) || state.accounts[0];
          }
          const found = findAccountMentionInText(nq);
          if (found) return found;
        }
        if (preferredCurrency) {
          const byCur = state.accounts.find(a => a.currency === preferredCurrency);
          if (byCur) return byCur;
        }
        return state.accounts[0];
      }

      function matchOpenDebts(cardQuery) {
        const cNorm = normalizeStr(cardQuery || '');
        return state.debts.filter(d => {
          if (d.status === 'settled' || d.kind === 'credit') return false;
          if (!cNorm) return true;
          const label = normalizeStr(`${getDebtInstrumentLabel(d)} ${d.title || ''} ${d.counterparty || ''} ${d.paymentMethod || ''}`);
          if (/\b(tarjeta|visa|master|oca|amex|cabal|credito|crédito)\b/.test(cNorm) && !/\b(prestamo|préstamo|persona)\b/.test(cNorm)) {
            const isCardItem = d.paymentMethod === 'credit_card' || Boolean((d.cardName || '').trim()) || /tarjeta|visa|master|oca|amex|cabal|zodimac/i.test(label);
            if (!isCardItem) return false;
          }
          if (/\b(prestamo|préstamo)\b/.test(cNorm)) {
            const isLoanItem = d.paymentMethod === 'personal' || /prestamo|préstamo/i.test(label);
            if (!isLoanItem) return false;
          }
          return label.includes(cNorm) || cNorm.includes(label) || /\b(tarjeta|prestamo|préstamo|cuota|cuotas|deuda)\b/.test(cNorm);
        });
      }

      for (const act of actions) {
        if (!act || !act.op) continue;

        if (act.op === 'pay_obligations') {
          const rawScope = act.scope || 'current_installments';
          const explicitlyAskedFull = /\b(?:todo|toda|todas|saldo\s+total|totalidad|completo|completa|cancele\s+todo|liquide\s+todo)\b/i.test(normalizeStr(originalText || ''));
          const scope = (rawScope === 'full_balance' && !explicitlyAskedFull) ? 'current_installments' : rawScope;
          const sourceAcc = matchAccount(act.accountQuery, act.currency || null);
          const targets = matchOpenDebts(act.cardQuery);
          if (!targets.length) continue;

          let totalPaidUYU = 0;
          let itemsTouched = 0;

          if (scope === 'current_installments') {
            for (const d of targets) {
              const remItem = getDebtRemainingAmount(d);
              if (remItem <= 0.01) continue;
              const instCount = Math.max(1, parseInt(d.installmentsCount, 10) || 1);
              const paidInst = Math.max(0, Math.min(instCount, parseInt(d.paidInstallments, 10) || 0));
              const instVal = getDebtInstallmentValue(d);
              const payNow = instCount > 1 ? Math.min(remItem, instVal) : remItem;
              const nextPaid = Math.min(instCount, paidInst + 1);
              d.paidInstallments = nextPaid;
              d.lastPaidAt = Date.now();
              if (nextPaid >= instCount || getDebtRemainingAmount(d) <= 0.01) {
                d.status = 'settled';
                d.settledAt = Date.now();
              }
              totalPaidUYU += (d.currency === 'USD' ? payNow * rate : payNow);
              itemsTouched++;
            }
          } else if (scope === 'full_balance') {
            for (const d of targets) {
              const remItem = getDebtRemainingAmount(d);
              if (remItem <= 0.01) continue;
              const instCount = Math.max(1, parseInt(d.installmentsCount, 10) || 1);
              d.paidInstallments = instCount;
              d.lastPaidAt = Date.now();
              d.status = 'settled';
              d.settledAt = Date.now();
              totalPaidUYU += (d.currency === 'USD' ? remItem * rate : remItem);
              itemsTouched++;
            }
          } else if (scope === 'exact_amount') {
            const amt = Math.abs(Number(act.amount) || 0);
            const cur = act.currency || (sourceAcc ? sourceAcc.currency : 'UYU');
            let remPoolUYU = (cur === 'USD' ? amt * rate : amt);
            for (const d of targets) {
              if (remPoolUYU <= 0.01) break;
              const remItem = getDebtRemainingAmount(d);
              const remItemUYU = (d.currency === 'USD' ? remItem * rate : remItem);
              const instCount = Math.max(1, parseInt(d.installmentsCount, 10) || 1);
              const paidInst = Math.max(0, Math.min(instCount, parseInt(d.paidInstallments, 10) || 0));
              const instVal = getDebtInstallmentValue(d);
              const instValUYU = (d.currency === 'USD' ? instVal * rate : instVal);
              if (remPoolUYU >= remItemUYU - 0.01) {
                d.paidInstallments = instCount;
                d.lastPaidAt = Date.now();
                d.status = 'settled';
                d.settledAt = Date.now();
                remPoolUYU -= remItemUYU;
                totalPaidUYU += remItemUYU;
                itemsTouched++;
              } else if (instCount > 1 && remPoolUYU >= instValUYU * 0.5) {
                const covered = Math.max(1, Math.min(instCount - paidInst, Math.floor((remPoolUYU + 0.01) / Math.max(0.01, instValUYU))));
                const nextPaid = Math.min(instCount, paidInst + covered);

                if (nextPaid >= instCount) {

                  d.settledAt = Date.now();

                const appliedUYU = (d.currency === 'USD' ? appliedVal * rate : appliedVal);
                remPoolUYU = Math.max(0, remPoolUYU - appliedUYU);

                itemsTouched++;
              } else {
                const paidUYU = Math.min(remItemUYU, remPoolUYU);
                const paidCur = (d.currency === 'USD' ? paidUYU / rate : paidUYU);
                const newRemCur = Math.max(0, remItem - paidCur);
                if (newRemCur <= 0.01) {
                  d.amount = 0;
                  d.paidInstallments = instCount;
                  d.status = 'settled';
                  d.settledAt = Date.now();
                } else if (instCount > 1) {
                  const left = Math.max(1, instCount - paidInst);
                  const newInst = Number((newRemCur / left).toFixed(2));
                  d.amount = Number((newInst * instCount).toFixed(2));
                } else {
                  d.amount = Number(newRemCur.toFixed(2));
                }
                remPoolUYU = 0;
                totalPaidUYU += paidUYU;
                itemsTouched++;
              }
            }
          }

          if (itemsTouched > 0 && totalPaidUYU > 0) {
            const txCur = act.currency || (sourceAcc ? sourceAcc.currency : 'UYU');
            const txAmt = txCur === 'USD' ? Number((totalPaidUYU / rate).toFixed(2)) : Math.round(totalPaidUYU);
            const deductInAcc = (sourceAcc && sourceAcc.currency === 'USD')
              ? Number((totalPaidUYU / rate).toFixed(2))
              : Math.round(totalPaidUYU);
            if (sourceAcc) {
              sourceAcc.balance = Number((sourceAcc.balance - deductInAcc).toFixed(2));
            }
            const now = new Date();
            const labelScope = scope === 'current_installments' ? 'Cuotas del mes' : (scope === 'full_balance' ? 'Saldo total' : 'Pago');
            const tx = {
              id: 'tx_' + Date.now() + '_' + Math.floor(Math.random() * 1000),
              title: (fromExternal ? '🤖 ' : '') + `${labelScope}${act.cardQuery ? ' (' + act.cardQuery + ')' : ''} con ${sourceAcc ? sourceAcc.name : 'Efectivo'}`,
              amount: txAmt,
              currency: txCur,
              type: 'expense',
              category: 'Tarjeta / Crédito',
              accountId: sourceAcc ? sourceAcc.id : 'acc_cash',
              accountName: sourceAcc ? sourceAcc.name : 'Efectivo',
              date: `${String(now.getDate()).padStart(2,'0')}/${String(now.getMonth()+1).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`,
              timestamp: Date.now()
            };
            state.transactions.unshift(tx);
            spawnFloatingBurst(`-${formatMoney(txAmt, txCur)} (${sourceAcc ? sourceAcc.name.split(' ')[0] : ''})`, false);
            summaryParts.push(`${labelScope}: -${formatMoney(txAmt, txCur)} en ${itemsTouched} ítem(s) desde ${sourceAcc ? sourceAcc.name : 'Efectivo'}`);
            executedAny = true;
          }
        } else if (act.op === 'add_transaction') {
          const amt = Math.abs(Number(act.amount) || 0);
          if (amt > 0) {
            const reqCur = act.currency || state.defaultCurrency || 'UYU';
            const acc = matchAccount(act.accountQuery, reqCur);
            const isSavAct = /\b(ahorr[eo]|ahorrar|ahorro|reservar|reserve)\b/i.test(normalizeStr(`${act.title || ''} ${act.category || ''} ${originalText || ''}`));
            const finalTitle = isSavAct ? (`Ahorro: ${(act.title || 'Reserva').replace(/^ahorro:?\s*/i, '')}`) : (act.title || 'Movimiento al contado');
            const tx = addTransaction({
              title: finalTitle,
              amount: amt,
              currency: reqCur,
              type: act.type === 'income' ? 'income' : 'expense',
              category: act.category || (act.type === 'income' ? 'Ingreso' : 'Comida y Súper'),
              accountId: acc ? acc.id : null,
              fromExternal
            });
            if (tx) {
              summaryParts.push(`${tx.title} (${formatMoney(tx.amount, tx.currency)} en ${tx.accountName})`);
              executedAny = true;
            }
          }
        } else if (act.op === 'add_debt') {
          const rawAmt = Math.abs(Number(act.amount) || 0);
          const instC = Math.max(1, parseInt(act.installmentsCount, 10) || 1);
          if (rawAmt > 0) {
            const totalAmt = (instC > 1 && act.perInstallment) ? Number((rawAmt * instC).toFixed(2)) : rawAmt;
            const normOrig = normalizeStr(originalText || '');
            const isPurchaseOnCredit = /\b(?:gaste|compre|pague|en\s+credito|a\s+credito|tarjeta\s+de\s+credito)\b/i.test(normOrig) && !/\b(?:me\s+deben|me\s+debe|preste|por\s+cobrar)\b/i.test(normOrig);
            const kind = isPurchaseOnCredit ? 'debt' : (act.kind === 'credit' ? 'credit' : 'debt');
            const payMethod = isPurchaseOnCredit ? 'credit_card' : (act.paymentMethod === 'personal' ? 'personal' : 'credit_card');
            const cardName = payMethod === 'credit_card' ? ((act.cardName || act.counterparty || 'Tarjeta de Crédito').trim()) : '';
            const partyName = payMethod === 'personal' ? ((act.counterparty || act.cardName || 'Préstamo').trim()) : (cardName || 'Tarjeta');
            const cur = act.currency || state.defaultCurrency || 'UYU';

            if (cardName && Array.isArray(state.creditCards)) {
              const exists = state.creditCards.some(c => String(c.name || '').trim().toLowerCase() === cardName.toLowerCase());
              if (!exists) {
                state.creditCards.unshift({
                  id: 'card_' + Date.now() + '_' + Math.floor(Math.random() * 1000),
                  name: cardName,
                  bank: '',
                  brand: 'Visa',
                  currency: cur,
                  closingDay: '',
                  dueDay: ''
                });
              }
            }

            state.debts.unshift({
              id: 'debt_' + Date.now() + '_' + Math.floor(Math.random() * 1000),
              title: act.title || (payMethod === 'personal' ? 'Préstamo' : 'Compra tarjeta'),
              counterparty: partyName,
              paymentMethod: payMethod,
              cardName,
              installmentsCount: instC,
              paidInstallments: 0,
              amount: totalAmt,
              currency: cur,
              kind,
              dueDate: act.dueDate || '',
              status: 'pending',
              notes: '',
              createdAt: Date.now()
            });

            const now = new Date();
            const cuotaTag = instC > 1 ? ` • ${instC} cuotas` : '';
            const tx = {
              id: 'tx_ai_' + Date.now() + '_' + Math.floor(Math.random() * 1000),
              title: (fromExternal ? '🤖 ' : '') + (payMethod === 'personal' ? `🤝 Préstamo: ${act.title || 'Préstamo'} (${partyName}${cuotaTag})` : `💳 ${act.title || 'Compra'} (${cardName}${cuotaTag})`),
              amount: totalAmt,
              currency: cur,
              type: kind === 'credit' ? 'income' : 'expense',
              category: payMethod === 'personal' ? 'Préstamo' : 'Tarjeta / Crédito',
              accountId: payMethod === 'personal' ? 'loan_ledger' : ('card_' + cardName.toLowerCase().replace(/[^a-z0-9]+/g, '_')),
              accountName: payMethod === 'personal' ? `Préstamo (${partyName})` : cardName,
              date: `${String(now.getDate()).padStart(2,'0')}/${String(now.getMonth()+1).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`,
              timestamp: Date.now()
            };
            state.transactions.unshift(tx);
            spawnFloatingBurst(`${payMethod === 'personal' ? '🤝' : '💳'} ${formatMoney(totalAmt, cur)}`, kind === 'credit');
            summaryParts.push(`${payMethod === 'personal' ? 'Préstamo' : 'Tarjeta'}: ${act.title || ''} (${formatMoney(totalAmt, cur)}${cuotaTag})`);
            executedAny = true;
          }
        } else if (act.op === 'query_balance') {
          const acc = act.accountQuery ? matchAccount(act.accountQuery) : null;
          const reply = acc ? `El saldo de ${acc.name} es de ${formatMoney(acc.balance, acc.currency)}.` : `Tu patrimonio total es de ${formatMoney(getTotals().totalUYU, 'UYU')}.`;
          ui.geminiResponse = { mode: 'query', prompt: originalText, reply, items: [] };
          speakText(reply);
          render();
          return true;
        }
      }

      if (executedAny) {
        const reply = (fromExternal ? '[Google Tasks] ' : '') + summaryParts.join(' • ');
        ui.geminiResponse = { mode: 'action', prompt: originalText, reply, items: [] };
        speakText(reply);
        saveState(true, true);
        return true;
      }
      return false;
    }

    async function processGeminiCommand(rawInput, fromExternal = false) {
      if (!rawInput || !rawInput.trim()) return;
      const text = rawInput.replace(/_/g, ' ').replace(/\+/g, ' ').trim().replace(/^(?:hey\s+gemini|hola\s+gemini|gemini|tarea\s+|en\s+krono\s+|krono[:\s,-]*)+/i, '').trim();
      const activeKey = (state.geminiApiKey && String(state.geminiApiKey).trim()) || (localStorage.getItem('KRONO_GEMINI_API_KEY') || '').trim();
      if (activeKey && !state.geminiApiKey) state.geminiApiKey = activeKey;

      if (!activeKey) {
        ui.lastInterpreterMode = '⚠️ Falta Gemini API Key';
        ui.geminiResponse = {
          mode: 'error',
          prompt: text,
          reply: '⚠️ Configurá tu Gemini API Key en ⚙️ Ajustes para usar 100% IA Gemini (el respaldo local está desactivado).',
          items: []
        };
        render();
        return;
      }

      ui.lastInterpreterMode = '🧠 IA Gemini (procesando...)';
      render();
      try {
        const { actions, modelName } = await interpretWithGeminiAI(text, activeKey);
        if (actions && actions.length && executeStructuredActions(actions, text, fromExternal)) {
          ui.lastInterpreterMode = `🧠 100% IA Gemini (${modelName})`;
          if (ui.geminiResponse) {
            ui.geminiResponse.reply = `[🧠 ${modelName}] ` + ui.geminiResponse.reply;
            render();
          }
          return;
        }
        ui.lastInterpreterMode = `🧠 IA Gemini (${modelName} • sin acción)`;
        ui.geminiResponse = {
          mode: 'error',
          prompt: text,
          reply: `🧠 Gemini (${modelName}) no detectó una acción financiera en esa frase. Probá indicando monto y concepto.`,
          items: []
        };
        render();
      } catch (err) {
        const reason = (err && err.message) ? err.message : 'error de conexión con la API de Gemini';
        ui.lastInterpreterMode = '❌ Error IA Gemini';
        ui.geminiResponse = {
          mode: 'error',
          prompt: text,
          reply: `❌ Error de IA Gemini: ${reason}`,
          items: []
        };
        render();
      }
    }

    function runLocalRuleInterpreter(text, lower, fromExternal = false) {
      if ((lower.includes('actualiza') || lower.includes('release')) && lower.includes('app')) {
        ui.showOtaModal = true;
        checkGitHubReleaseOtaUpdate(true);
        render();
        return;
      }

      if (lower.includes('cuanto') || lower.includes('saldo') || lower.includes('patrimonio')) {
        const sp = findAccountMentionInText(text);
        const reply = sp ? `El saldo de ${sp.name} es de ${formatMoney(sp.balance, sp.currency)}.` : `Tu patrimonio total es de ${formatMoney(getTotals().totalUYU, 'UYU')}.`;
        ui.geminiResponse = { mode: 'query', prompt: text, reply, items: [] };
        speakText(reply);
        render();
        return;
      }

      function isCardOrDebtItem(item) {
        if (!item || item.status === 'settled') return false;
        const label = `${getDebtInstrumentLabel(item)} ${item.title || ''} ${item.counterparty || ''}`;
        return item.paymentMethod === 'credit_card' || Boolean((item.cardName || '').trim()) || /tarjeta|visa|master|oca|amex|cabal|zodimac|brou|itau|itaú|santander|bbva|scotia|prex|midinero|cuota|prestamo|préstamo|deuda/i.test(normalizeStr(label));
      }

      function findMatchingCardName(normText) {
        const cards = Array.isArray(state.creditCards) ? state.creditCards : [];
        for (const c of cards) {
          const cNorm = normalizeStr(c.name || '');
          if (cNorm && normText.includes(cNorm)) return c.name;
          const bNorm = normalizeStr(c.bank || '');
          if (bNorm && bNorm.length >= 3 && normText.includes(bNorm)) return c.name;
        }
        const m = normText.match(/\b(?:(?:itau|itaú|brou|santander|bbva|scotia|hsbc|prex|midinero|zodimac)\s+(?:visa|mastercard|master|oca|amex|cabal|recompensa)|visa|mastercard|master|oca|american\s+express|amex|cabal|brou\s+recompensa|santander|itau|itaú|bbva|scotia|hsbc|prex|midinero|zodimac)\b/i);
        return m ? m[0].replace(/\b\w/g, ch => ch.toUpperCase()) : '';
      }

      function resolvePaymentSourceAccount(normText) {
        if (/\b(efectivo|billetera|cash|contado|en mano|monedero|plata en efectivo)\b/i.test(normText)) {
          return state.accounts.find(a => a.id === 'acc_cash' || /efectivo|billetera|cash|mano/i.test(normalizeStr(a.name))) || state.accounts[0];
        }
        const mentioned = findAccountMentionInText(normText);
        if (mentioned) return mentioned;
        return state.accounts.find(a => a.id === 'acc_cash' || /efectivo|billetera|cash/i.test(normalizeStr(a.name))) || state.accounts[0];
      }

      const isPayingCardOrDebt = /\b(?:pague|pagar|abone|abonar|cancele|cancelar|liquide|liquidar|salde|saldar)\b/i.test(lower)
        && /\b(?:tarjeta|visa|mastercard|master|oca|amex|cabal|zodimac|cierre|resumen|deuda|cuota|cuotas|prestamo|préstamo|credito|crédito|pendiente)\b/i.test(lower);

      if (isPayingCardOrDebt) {
        if (!Array.isArray(state.debts)) state.debts = [];
        const rate = Number(state.exchangeRate) || 41.5;
        const explicitAmount = extractSmartAmount(lower);
        const targetCardName = findMatchingCardName(lower);
        const sourceAcc = resolvePaymentSourceAccount(lower);
        const targetCurrency = detectCurrencyInText(lower) || (sourceAcc ? sourceAcc.currency : (state.defaultCurrency || 'UYU'));

        // Distinguish whether user asked for THIS MONTH'S installments ("cuotas de este mes" / "cuotas del mes" / "cuota de este mes" / "cuotas") vs FULL BALANCE ("todo" / "saldo total")
        const wantsCurrentInstallmentsOnly = !/\b(?:todo|toda|todas|saldo\s+total|totalidad|completo|completa|cancele\s+todo|liquide\s+todo)\b/i.test(lower);

        let candidateDebts = state.debts.filter(d => {
          if (d.status === 'settled' || d.kind === 'credit') return false;
          if (targetCardName) {
            const dLabel = normalizeStr(getDebtInstrumentLabel(d) || `${d.title || ''} ${d.counterparty || ''}`);
            return dLabel.includes(normalizeStr(targetCardName)) || normalizeStr(targetCardName).includes(dLabel);
          }
          return isCardOrDebtItem(d);
        });

        if (!candidateDebts.length && !explicitAmount) {
          candidateDebts = state.debts.filter(d => d.status !== 'settled' && d.kind !== 'credit');
        }

        let calcUYU = 0;
        if (explicitAmount > 0) {
          calcUYU = (targetCurrency === 'USD' ? explicitAmount * rate : explicitAmount);
        } else if (wantsCurrentInstallmentsOnly) {
          candidateDebts.forEach(d => {
            const rem = getDebtRemainingAmount(d);
            if (rem <= 0.01) return;
            const instCount = Math.max(1, parseInt(d.installmentsCount, 10) || 1);
            const instVal = getDebtInstallmentValue(d);
            const payNow = instCount > 1 ? Math.min(rem, instVal) : rem;
            calcUYU += (d.currency === 'USD' ? payNow * rate : payNow);
          });
        } else {
          candidateDebts.forEach(d => {
            const rem = getDebtRemainingAmount(d);
            calcUYU += (d.currency === 'USD' ? rem * rate : rem);
          });
        }

        const payAmountTargetCur = explicitAmount > 0
          ? explicitAmount
          : (targetCurrency === 'USD' ? Number((calcUYU / rate).toFixed(2)) : Math.round(calcUYU));

        if (payAmountTargetCur > 0) {
          let deductInAccCur = payAmountTargetCur;
          if (sourceAcc && sourceAcc.currency !== targetCurrency) {
            deductInAccCur = (targetCurrency === 'USD' && sourceAcc.currency === 'UYU')
              ? payAmountTargetCur * rate
              : payAmountTargetCur / rate;
          }

          let remainingCreditToApplyUYU = (targetCurrency === 'USD' ? payAmountTargetCur * rate : payAmountTargetCur);
          let settledCount = 0;
          let updatedInstallmentsCount = 0;

          for (const d of candidateDebts) {
            if (remainingCreditToApplyUYU <= 0.01) break;
            const remItem = getDebtRemainingAmount(d);
            if (remItem <= 0.01) continue;
            const remItemUYU = (d.currency === 'USD' ? remItem * rate : remItem);
            const instCount = Math.max(1, parseInt(d.installmentsCount, 10) || 1);
            const paidInst = Math.max(0, Math.min(instCount, parseInt(d.paidInstallments, 10) || 0));
            const instVal = getDebtInstallmentValue(d);
            const instValUYU = (d.currency === 'USD' ? instVal * rate : instVal);

            if (wantsCurrentInstallmentsOnly && !explicitAmount) {
              // Advance ONLY 1 installment (current month) per debt/card plan, keeping future installments pending
              const payNow = instCount > 1 ? Math.min(remItem, instVal) : remItem;
              const nextPaid = Math.min(instCount, paidInst + 1);
              d.paidInstallments = nextPaid;
              d.lastPaidAt = Date.now();
              if (nextPaid >= instCount || getDebtRemainingAmount(d) <= 0.01) {
                d.status = 'settled';
                d.settledAt = Date.now();
                settledCount++;
              } else {
                updatedInstallmentsCount++;
              }
              remainingCreditToApplyUYU = Math.max(0, remainingCreditToApplyUYU - (d.currency === 'USD' ? payNow * rate : payNow));
            } else if (remainingCreditToApplyUYU >= remItemUYU - 0.01 || (!explicitAmount && instCount === 1)) {
              d.paidInstallments = instCount;
              d.lastPaidAt = Date.now();
              d.status = 'settled';
              d.settledAt = Date.now();
              remainingCreditToApplyUYU = Math.max(0, remainingCreditToApplyUYU - remItemUYU);
              settledCount++;
            } else if (instCount > 1 && remainingCreditToApplyUYU >= instValUYU * 0.5) {
              const coveredInst = Math.max(1, Math.min(instCount - paidInst, Math.floor((remainingCreditToApplyUYU + 0.01) / Math.max(0.01, instValUYU))));
              const newPaid = Math.min(instCount, paidInst + coveredInst);
              const appliedVal = Number((instVal * coveredInst).toFixed(2));
              d.paidInstallments = newPaid;
              d.lastPaidAt = Date.now();
              if (newPaid >= instCount) {
                d.status = 'settled';
                d.settledAt = Date.now();
                settledCount++;
              } else {
                updatedInstallmentsCount++;
              }
              remainingCreditToApplyUYU = Math.max(0, remainingCreditToApplyUYU - (d.currency === 'USD' ? appliedVal * rate : appliedVal));
            } else if (explicitAmount > 0) {
              const paidUYU = Math.min(remItemUYU, remainingCreditToApplyUYU);
              const paidInDebtCur = (d.currency === 'USD' ? paidUYU / rate : paidUYU);
              const newRemInDebtCur = Math.max(0, remItem - paidInDebtCur);
              if (newRemInDebtCur <= 0.01) {
                d.amount = 0;
                d.paidInstallments = instCount;
                d.status = 'settled';
                d.settledAt = Date.now();
                settledCount++;
              } else {
                if (instCount > 1) {
                  const remInstLeft = Math.max(1, instCount - paidInst);
                  const newInstVal = Number((newRemInDebtCur / remInstLeft).toFixed(2));
                  d.amount = Number((newInstVal * instCount).toFixed(2));
                } else {
                  d.amount = Number(newRemInDebtCur.toFixed(2));
                }
                updatedInstallmentsCount++;
              }
              remainingCreditToApplyUYU = 0;
            }
          }

          if (sourceAcc) {
            sourceAcc.balance = Number((sourceAcc.balance - deductInAccCur).toFixed(2));
          }
          const now = new Date();
          const cardLabelDesc = targetCardName ? ` (${targetCardName})` : ' (Tarjeta de crédito)';
          const modeLabelDesc = (wantsCurrentInstallmentsOnly && !explicitAmount) ? 'Cuotas del mes ' : 'Pago ';
          const accLabelDesc = sourceAcc ? sourceAcc.name : 'Efectivo';
          const tx = {
            id: 'tx_' + Date.now() + '_' + Math.floor(Math.random() * 1000),
            title: (fromExternal ? '🤖 ' : '') + `${modeLabelDesc}tarjeta${cardLabelDesc} con ${accLabelDesc}`,
            amount: payAmountTargetCur,
            currency: targetCurrency,
            type: 'expense',
            category: 'Tarjeta / Crédito',
            accountId: sourceAcc ? sourceAcc.id : 'acc_cash',
            accountName: accLabelDesc,
            date: `${String(now.getDate()).padStart(2,'0')}/${String(now.getMonth()+1).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`,
            timestamp: Date.now()
          };
          state.transactions.unshift(tx);

          const dsAfter = getDebtsSummary();
          const reply = (fromExternal ? '[Google Tasks] ' : '')
            + `${modeLabelDesc}registrado: ${formatMoney(payAmountTargetCur, targetCurrency)}${cardLabelDesc} desde ${accLabelDesc}. `
            + `Saldados: ${settledCount}, cuotas actualizadas: ${updatedInstallmentsCount}. `
            + `Próximo pago de cuotas: ${formatMoney(dsAfter.nextInstallmentsUYU, 'UYU')} y saldo en ${accLabelDesc}: ${sourceAcc ? formatMoney(sourceAcc.balance, sourceAcc.currency) : '$ 0'}.`;

          ui.geminiResponse = { mode: 'action', prompt: text, reply, items: [tx] };
          spawnFloatingBurst(`-${formatMoney(payAmountTargetCur, targetCurrency)} (${accLabelDesc})`, false);
          speakText(reply);
          saveState(true, true);
          return;
        }
      }

      const debtIntentMatch = /(?:^|\b)(?:debo|me\s+deben|me\s+debe|prestamo|préstamo|credito|crédito|deuda|cuota\s+pendiente|pendiente\s+de\s+(?:cobro|pago)|tarjeta\s+de\s+credito|en\s+\d+\s+cuotas?|\d+\s+cuotas?)(?:\b|$)/i.test(lower) && !/\b(?:pague|pagué|cobre|cobré|gaste|gasté)\b/i.test(lower);
      if (debtIntentMatch) {
        if (!Array.isArray(state.debts)) state.debts = [];
        let installmentsCount = 1;
        const instMatch = lower.match(/(?:en|de|a|son)\s+(\d{1,3})\s+cuotas?/) || lower.match(/(\d{1,3})\s+cuotas?/);
        if (instMatch && parseInt(instMatch[1], 10) > 1) {
          installmentsCount = Math.min(120, parseInt(instMatch[1], 10));
        }
        const perInstallmentPhrase = /\b(?:por\s+cuota|cada\s+cuota|cuota\s+de|de\s+cuota)\b/i.test(lower);
        let workText = text;
        if (installmentsCount > 1) {
          workText = workText.replace(new RegExp(`(?:\\b(?:en|de|a|son)\\s+)?${installmentsCount}\\s+cuotas?`, 'gi'), ' ');
        }
        const rawAmount = extractSmartAmount(workText);
        if (rawAmount > 0) {
          const isCredit = /\b(?:me\s+deben|me\s+debe|preste|presté|por\s+cobrar)\b/i.test(lower) && !/\b(?:gaste|gasté|compre|compré|en\s+credito|en\s+crédito|a\s+credito|a\s+crédito|tarjeta)\b/i.test(lower);
          const cardMatch = workText.match(/\b(?:(?:itau|itaú|brou|santander|bbva|scotia|hsbc|prex|midinero)\s+(?:visa|mastercard|master|oca|amex|cabal|recompensa)|visa|mastercard|master|oca|american\s+express|amex|cabal|brou\s+recompensa|santander|itau|itaú|bbva|scotia|hsbc|prex|midinero)\b/i);
          const cardName = cardMatch ? cardMatch[0].replace(/\b\w/g, c => c.toUpperCase()) : '';
          const paymentMethod = cardName || /\btarjeta\b/i.test(lower) ? 'credit_card' : (installmentsCount > 1 ? 'installment_plan' : (/\bprestamo|préstamo\b/i.test(lower) ? 'personal' : 'general'));
          const currency = detectCurrencyInText(lower) || state.defaultCurrency || 'UYU';

      let btn = existing;
      if (!btn) {
        btn = document.createElement('button');
        btn.id = 'krono-voice-fab';

        btn.setAttribute('aria-label', 'Dictado por voz');

        document.body.appendChild(btn);
      }

          const h3 = card.querySelector('h3');
          if (!h3 || !h3.textContent) return null;
          const idx = Array.from(list.children).indexOf(row);
          if (h3.textContent.indexOf('Cuentas Activas') !== -1) {
            return { kind: 'account', el: row, idx: idx, needsRipple: true };
          }
          if (h3.textContent.indexOf('Top Presupuestos') !== -1) {
            return { kind: 'budget', el: row, idx: idx, needsRipple: true };
          }
          return null;
        }
        if (ui.activeTab === 'accounts') {
          const card = target.closest('main .grid > .spring-card.glass-97');
          if (!card || !card.parentElement) return null;
          return { kind: 'account', el: card, idx: Array.from(card.parentElement.children).indexOf(card), needsRipple: false };
        }
        if (ui.activeTab === 'budgets') {
          const card = target.closest('main .grid > .spring-card.glass-97');
          if (!card || !card.parentElement) return null;
          return { kind: 'budget', el: card, idx: Array.from(card.parentElement.children).indexOf(card), needsRipple: false };
        }
        return null;
      }

      document.addEventListener('pointerdown', function(e) {
        const hit = findNavigableCard(e.target);
        if (!hit || !hit.needsRipple) return;
        spawnRipple(hit.el, e.clientX, e.clientY);
      }, { passive: true });

      document.addEventListener('click', function(e) {
        const hit = findNavigableCard(e.target);
        if (!hit || typeof state === 'undefined') return;
        if (hit.kind === 'account') {
          const acc = Array.isArray(state.accounts) ? state.accounts[hit.idx] : null;
          if (!acc || !acc.id) return;
          e.stopPropagation();
          openMovementsWithFilters({ accountId: acc.id });
        } else if (hit.kind === 'budget') {
          const bg = Array.isArray(state.budgets) ? state.budgets[hit.idx] : null;
          if (!bg || !bg.name) return;
          e.stopPropagation();
          openMovementsWithFilters({ type: 'expense', search: bg.name });
        }
      }, true);
    })();
  </script>

</body></html>
