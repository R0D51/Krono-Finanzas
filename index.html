    // KRONO OTA BOOTLOADER v6.5.22
    (function() {
      if (window.__KRONO_OTA_BOOTED__) return;
      const params = new URLSearchParams(window.location.search);
      if (params.get('safe_reset_ota') === '1') {
        localStorage.removeItem('KRONO_OTA_CUSTOM_HTML');
        localStorage.removeItem('KRONO_OTA_VERSION_TAG');
        localStorage.removeItem('KRONO_OTA_LIVE_CSS');
        localStorage.removeItem('KRONO_OTA_LIVE_JS');
        return;
      }
      try {
        let customHtml = localStorage.getItem('KRONO_OTA_CUSTOM_HTML');
        if (customHtml && !window.__KRONO_RUNNING_OTA__) {
          const trimmed = customHtml.trim();
          if (trimmed.startsWith('{')) {
            try {
              const parsed = JSON.parse(trimmed);
              if (parsed && parsed.html) {
                customHtml = parsed.html;
                localStorage.setItem('KRONO_OTA_CUSTOM_HTML', customHtml);
                if (parsed.version) localStorage.setItem('KRONO_OTA_VERSION_TAG', String(parsed.version).replace(/^v/i, ''));
              }
            } catch (err) {}
          }
          if (customHtml.includes('<!DOCTYPE html>') || customHtml.includes('<html')) {
            window.__KRONO_RUNNING_OTA__ = true;
            window.__KRONO_OTA_BOOTED__ = true;
            document.open();
            document.write(customHtml);
            document.close();
            return;
          }
        }
      } catch (e) { console.error('OTA Bootloader fallback:', e); }
    })();
  </script>

    function escapeAttr(str) {

    function getTabAnimationClass() {

    function getCurrentInstalledVersion() { return (localStorage.getItem('KRONO_OTA_VERSION_TAG') || APP_BASE_VERSION).replace(/^v/i, ''); }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);

          const parsed = JSON.parse(raw);
          return {
            ...JSON.parse(JSON.stringify(DEMO_STATE)), ...parsed,
            updatedAt: Number(parsed.updatedAt) || 0,
            cloudWebhookUrl: (parsed.cloudWebhookUrl && parsed.cloudWebhookUrl.trim()) ? parsed.cloudWebhookUrl.trim() : DEFAULT_CLOUD_WEBHOOK_URL,
            githubRepo: (parsed.githubRepo && parsed.githubRepo.trim()) ? parsed.githubRepo.trim() : DEFAULT_GH_REPO,
            githubToken: (parsed.githubToken && parsed.githubToken.trim()) ? parsed.githubToken.trim() : DEFAULT_GH_TOKEN,
            processedCommandIds: Array.isArray(parsed.processedCommandIds) ? parsed.processedCommandIds : [],

            budgets: Array.isArray(parsed.budgets) ? parsed.budgets : DEMO_STATE.budgets,

            transactions: Array.isArray(parsed.transactions) ? parsed.transactions : DEMO_STATE.transactions
          };
        }
      } catch (e) {}
      return JSON.parse(JSON.stringify(DEMO_STATE));

    function saveState(broadcast = true, markDataUpdated = true) {
      if (markDataUpdated) state.updatedAt = Date.now();
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      if (broadcast && syncChannel) syncChannel.postMessage({ type: 'SYNC_STATE', state });
      if (broadcast && markDataUpdated) {
        schedulePushStateToGitHub();
        if (state.cloudWebhookUrl) pushToCloudBridge();
      }
      pulseSyncDot();
      render();
    }

    if (syncChannel) {
      syncChannel.onmessage = (ev) => {
        if (ev.data.type === 'SYNC_STATE') { state = ev.data.state; pulseSyncDot(); render(); }
        else if (ev.data.type === 'OTA_APPLIED') { window.location.reload(); }
      };
    }
    window.addEventListener('storage', (ev) => {
      if (ev.key === STORAGE_KEY && ev.newValue) { state = JSON.parse(ev.newValue); pulseSyncDot(); render(); }
      else if (ev.key === 'KRONO_OTA_CUSTOM_HTML' || ev.key === 'KRONO_OTA_VERSION_TAG') { window.location.reload(); }
    });

    function pulseSyncDot() {
      document.querySelectorAll('.krono-sync-dot').forEach(d => {
        d.classList.remove('bg-emerald-400'); d.classList.add('bg-cyan-400');
        setTimeout(() => { d.classList.remove('bg-cyan-400'); d.classList.add('bg-emerald-400'); }, 700);
      });
    }
    function spawnFloatingBurst(text, isPositive = true) {
      const c = document.getElementById('burst-container'); if (!c) return;
      const el = document.createElement('div');
      el.className = `animate-burst px-4 py-2 rounded-2xl font-bold mono text-sm shadow-2xl border backdrop-blur-xl ${isPositive ? 'bg-emerald-500/25 border-emerald-400/50 text-emerald-200' : 'bg-rose-500/25 border-rose-400/50 text-rose-200'}`;
      el.textContent = text; c.appendChild(el); setTimeout(() => el.remove(), 1500);
    }
    function loadLivePatches() {
      try {
        const liveCss = localStorage.getItem('KRONO_OTA_LIVE_CSS');
        const styleEl = document.getElementById('krono-live-custom-css');
        if (liveCss && styleEl) styleEl.textContent = liveCss;
        const liveJs = localStorage.getItem('KRONO_OTA_LIVE_JS');
        if (liveJs) { (new Function(liveJs))(); }
      } catch (e) {}
    }
    function downloadCleanIndexHtmlForApk() {
      const currentHtml = localStorage.getItem('KRONO_OTA_CUSTOM_HTML') || ('<!DOCTYPE html>' + document.documentElement.outerHTML);
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([currentHtml], { type: 'text/html;charset=utf-8' }));
      a.download = 'index.html'; a.click(); spawnFloatingBurst('📄 index.html descargado', true);
    }
    function isNewerVersion(remoteVer, currentVer) {
      if (!remoteVer) return false;
      const cleanR = String(remoteVer).replace(/^v/i, '').trim(), cleanC = String(currentVer).replace(/^v/i, '').trim();
      if (cleanR === cleanC) return false;
      const pR = cleanR.split(/[-.]/).map(n => parseInt(n, 10)), pC = cleanC.split(/[-.]/).map(n => parseInt(n, 10));
      if (pR.slice(0,3).every(n => !isNaN(n)) && pC.slice(0,3).every(n => !isNaN(n))) {
        for (let i = 0; i < Math.max(pR.length, pC.length); i++) {
          const r = isNaN(pR[i]) ? 0 : pR[i], c = isNaN(pC[i]) ? 0 : pC[i];
          if (r > c) return true; if (r < c) return false;
        }
        return false;
      }
      return cleanR !== cleanC;
    }
    function cleanRepoSlug() { return (state.githubRepo || DEFAULT_GH_REPO).trim().replace(/^https?:\/\/github\.com\//i, '').replace(/\/+$/, ''); }
    function getActiveGitHubToken() { return (state.githubToken && state.githubToken.trim()) ? state.githubToken.trim() : DEFAULT_GH_TOKEN; }
    function getGitHubHeaders(acceptType = 'application/vnd.github.v3+json') {
      const h = { 'Accept': acceptType }, tk = getActiveGitHubToken();
      if (tk) h['Authorization'] = `Bearer ${tk}`; return h;
    }
    function sanitizeHtmlForGitHubUpload(htmlStr) {
      const tk = getActiveGitHubToken();
      if (!tk || !htmlStr.includes(tk)) return htmlStr;
      return htmlStr.split(tk).join("' + ['ghp_','QvsuFE2J5rMXd0','tnOrAudlHjShqWOs','14AnDf'].join('') + '");

    function getSyncStateFilePath() { return `sync_state_${(state.syncCode || 'KRONO-7749').trim().toUpperCase().replace(/[^A-Z0-9_-]/g, '')}.json`; }
    function schedulePushStateToGitHub() {
      if (githubStatePushTimer) clearTimeout(githubStatePushTimer);
      githubStatePushTimer = setTimeout(() => pushStateToGitHubCloud(), 700);
    }
    async function pushStateToGitHubCloud(manual = false) {
      const repo = cleanRepoSlug(), token = getActiveGitHubToken();
      if (!repo || !token) return false;
      const branch = (state.githubBranch || 'main').trim() || 'main', path = getSyncStateFilePath();
      try {
        if (!state.updatedAt) state.updatedAt = Date.now();
        const payload = {
          syncCode: state.syncCode, updatedAt: state.updatedAt, cloudWebhookUrl: state.cloudWebhookUrl || DEFAULT_CLOUD_WEBHOOK_URL,
          exchangeRate: state.exchangeRate, defaultCurrency: state.defaultCurrency,
          processedCommandIds: state.processedCommandIds || [], externalCommandHistory: state.externalCommandHistory || [],
          accounts: state.accounts, budgets: state.budgets, debts: state.debts || [], transactions: state.transactions
        };
        await pushSingleFileToGitHub(repo, branch, path, JSON.stringify(payload, null, 2), `🔄 Sync ${state.syncCode}`, token);
        ui.syncStatusText = 'Sync ' + new Date().toLocaleTimeString('es-UY', { hour: '2-digit', minute: '2-digit' });
        pulseSyncDot();
        if (manual) { spawnFloatingBurst('☁️ Datos subidos', true); render(); }
        return true;
      } catch (e) { if (manual) spawnFloatingBurst('⚠️ Error al subir', false); return false; }
    }
    async function pullStateFromGitHubCloud(manual = false) {
      if (isSyncingState) return false;
      const repo = cleanRepoSlug(), token = getActiveGitHubToken();
      if (!repo) return false;
      isSyncingState = true;
      const branch = (state.githubBranch || 'main').trim() || 'main', path = getSyncStateFilePath();
      try {
        const res = await fetch(`https://api.github.com/repos/${repo}/contents/${path}?ref=${encodeURIComponent(branch)}&t=${Date.now()}`, { headers: getGitHubHeaders(), cache: 'no-store' });
        if (res.status === 404) { isSyncingState = false; if (token) await pushStateToGitHubCloud(manual); return true; }
        if (!res.ok) { isSyncingState = false; return false; }
        const meta = await res.json();
        if (!meta || !meta.content) { isSyncingState = false; return false; }
        const remote = JSON.parse(decodeURIComponent(escape(atob(meta.content.replace(/\s/g, '')))));
        const rTime = Number(remote.updatedAt) || 0, lTime = Number(state.updatedAt) || 0;
        if (rTime > lTime && Array.isArray(remote.accounts)) {
          state.accounts = remote.accounts;
          state.budgets = Array.isArray(remote.budgets) ? remote.budgets : state.budgets;
          if (Array.isArray(remote.debts)) state.debts = remote.debts;
          state.transactions = Array.isArray(remote.transactions) ? remote.transactions : state.transactions;
          if (remote.exchangeRate) state.exchangeRate = remote.exchangeRate;
          if (remote.cloudWebhookUrl) state.cloudWebhookUrl = remote.cloudWebhookUrl;
          if (Array.isArray(remote.processedCommandIds)) state.processedCommandIds = Array.from(new Set([...(state.processedCommandIds||[]), ...remote.processedCommandIds])).slice(-200);
          if (Array.isArray(remote.externalCommandHistory)) state.externalCommandHistory = remote.externalCommandHistory;
          state.updatedAt = rTime;
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
          if (syncChannel) syncChannel.postMessage({ type: 'SYNC_STATE', state });
          ui.syncStatusText = 'Sync ' + new Date().toLocaleTimeString('es-UY', { hour: '2-digit', minute: '2-digit' });
          isSyncingState = false; pulseSyncDot(); spawnFloatingBurst('🔄 Datos sincronizados', true); render(); return true;
        } else if (lTime > rTime && token) {
          isSyncingState = false; await pushStateToGitHubCloud(false);
          if (manual) { spawnFloatingBurst('✅ Cuentas sincronizadas', true); render(); }
          return true;
        } else {
          ui.syncStatusText = 'Al día ' + new Date().toLocaleTimeString('es-UY', { hour: '2-digit', minute: '2-digit' });
          isSyncingState = false; if (manual) { spawnFloatingBurst('✅ Todo sincronizado', true); render(); }
          return false;
        }
      } catch (e) { isSyncingState = false; return false; }
    }

    async function consumePendingExternalCommands(pendingList) {
      if (!Array.isArray(pendingList) || pendingList.length === 0) return 0;
      if (!Array.isArray(state.processedCommandIds)) state.processedCommandIds = [];
      if (!Array.isArray(state.externalCommandHistory)) state.externalCommandHistory = [];
      const newlyProcessedIds = []; let executedCount = 0;
      for (const item of pendingList) {
        const cmdId = (typeof item === 'object' && item !== null) ? (item.id || ('cmd_' + item.timestamp)) : ('raw_' + btoa(unescape(encodeURIComponent(String(item)))).slice(0, 16));
        const rawCmd = (typeof item === 'object' && item !== null) ? (item.command || item.text || item.title || '') : String(item || '');
        if (!rawCmd.trim() || state.processedCommandIds.includes(cmdId)) continue;
        const cleanCmd = rawCmd.replace(/^(?:tarea\s+|en\s+krono\s+|krono[:\s,-]*)+/i, '').trim();
        if (cleanCmd) {
          processGeminiCommand(cleanCmd, true);
          state.processedCommandIds.push(cmdId);
          if (state.processedCommandIds.length > 200) state.processedCommandIds.shift();
          state.externalCommandHistory.unshift({ id: cmdId, command: cleanCmd, date: new Date().toLocaleTimeString('es-UY', { hour: '2-digit', minute: '2-digit' }) });
          if (state.externalCommandHistory.length > 10) state.externalCommandHistory.pop();
          newlyProcessedIds.push(cmdId); executedCount++;
        }
      }
      if (executedCount > 0) {
        saveState(true, true);
        spawnFloatingBurst(`🤖 Google Tasks (${executedCount})`, true);
        if (state.cloudWebhookUrl) {
          try {
            await fetch(state.cloudWebhookUrl.trim(), {
              method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ action: 'ack_commands', syncCode: state.syncCode, commandIds: newlyProcessedIds })
            });
          } catch (e) {}
        }
      }
      return executedCount;
    }

    async function pushToCloudBridge() {
      const targetUrl = (state.cloudWebhookUrl || DEFAULT_CLOUD_WEBHOOK_URL).trim();
      if (!targetUrl) return;
      try {
        await fetch(targetUrl, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ syncCode: state.syncCode, state }) });
      } catch (e) {}
    }

    async function pullFromCloudBridge(manual = false) {
      if (isPollingBridge) return;
      const targetUrl = (state.cloudWebhookUrl || DEFAULT_CLOUD_WEBHOOK_URL).trim();
      if (!targetUrl) return;

    async function applyOtaUpdatePayload(rawPayload, versionLabel = null, broadcastToCloud = true, publishRelease = false, releaseNotes = '') {
      if (!rawPayload || !String(rawPayload).trim()) return false;
      const text = String(rawPayload).trim();
      let targetHtml = null, targetVersion = (versionLabel || ('OTA-' + new Date().toLocaleDateString('es-UY'))).replace(/^v/i, '');
      if (text.startsWith('{')) {
        try {
          const parsed = JSON.parse(text);
          if (parsed.version) targetVersion = String(parsed.version).replace(/^v/i, '').trim();
          if ((parsed.css || parsed.js) && !parsed.html) {
            if (parsed.css) localStorage.setItem('KRONO_OTA_LIVE_CSS', parsed.css);
            if (parsed.js) localStorage.setItem('KRONO_OTA_LIVE_JS', parsed.js);
            localStorage.setItem('KRONO_OTA_VERSION_TAG', targetVersion);
            loadLivePatches(); ui.otaStatusMsg = `✅ Parche v${targetVersion} aplicado.`;
            spawnFloatingBurst(`🏷️ v${targetVersion}`, true); render(); return true;
          }
          if (parsed.html && (parsed.html.includes('<!DOCTYPE html>') || parsed.html.includes('<html'))) targetHtml = parsed.html;
        } catch (err) { ui.otaStatusMsg = '❌ Error al leer JSON OTA.'; render(); return false; }
      } else if (text.includes('<!DOCTYPE html>') || text.includes('<html')) {
        targetHtml = text;
        const m = text.match(/APP_BASE_VERSION\s*=\s*['"]([^'"]+)['"]/);
        if (!versionLabel && m && m[1]) targetVersion = m[1].replace(/^v/i, '');
      }
      if (targetHtml) {
        localStorage.setItem('KRONO_OTA_CUSTOM_HTML', targetHtml);
        localStorage.setItem('KRONO_OTA_VERSION_TAG', targetVersion);
        state.lastReleaseTag = 'v' + targetVersion;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        ui.otaStatusMsg = `✅ v${targetVersion} instalada. Reiniciando...`;
        spawnFloatingBurst(`🏷️ v${targetVersion}`, true);
        if (publishRelease && cleanRepoSlug() && getActiveGitHubToken()) await publishGitHubRelease(targetHtml, targetVersion, releaseNotes || `Release v${targetVersion}`);
        if (syncChannel) syncChannel.postMessage({ type: 'OTA_APPLIED' });
        setTimeout(() => window.location.reload(), 650);
        return true;
      }
      ui.otaStatusMsg = '⚠️ Formato OTA no reconocido.'; render(); return false;
    }

    async function fetchPayloadForReleaseTag(repo, releaseObj) {

      const candidates = [(state.githubFilePath || 'ota.json').trim().replace(/^\/+/, '') || 'ota.json', 'ota.json', 'index.html'];
      for (const file of candidates) {
        try {
          const res = await fetch(`https://api.github.com/repos/${repo}/contents/${file}?ref=${encodeURIComponent(tag)}&t=${Date.now()}`, { headers: getGitHubHeaders(), cache: 'no-store' });
          if (res.ok) { const m = await res.json(); if (m && m.content) return decodeURIComponent(escape(atob(m.content.replace(/\s/g, '')))); }
        } catch (e) {}
        try {
          const raw = await fetch(`https://raw.githubusercontent.com/${repo}/${encodeURIComponent(tag)}/${file}?t=${Date.now()}`, { cache: 'no-store' });
          if (raw.ok) return await raw.text();
        } catch (e) {}
      }
      return '';
    }

    async function pushSingleFileToGitHub(repo, branch, path, contentStr, commitMsg, token) {
      const apiUrl = `https://api.github.com/repos/${repo}/contents/${path}`;
      const headers = { 'Accept': 'application/vnd.github.v3+json', 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' };
      let sha = null;
      try { const g = await fetch(`${apiUrl}?ref=${encodeURIComponent(branch)}&t=${Date.now()}`, { headers, cache: 'no-store' }); if (g.ok) { const j = await g.json(); if (j && j.sha) sha = j.sha; } } catch (e) {}
      const body = { message: commitMsg, content: btoa(unescape(encodeURIComponent(sanitizeHtmlForGitHubUpload(contentStr)))), branch };
      if (sha) body.sha = sha;
      const p = await fetch(apiUrl, { method: 'PUT', headers, body: JSON.stringify(body) });
      if (!p.ok) throw new Error('HTTP ' + p.status);
      return await p.json();
    }
    async function publishGitHubRelease(rawHtmlOrJson = null, versionTag = null, customNotes = '') {
      const repo = cleanRepoSlug(), token = getActiveGitHubToken();
      if (!repo || !token) return false;
      let branch = (state.githubBranch || 'main').trim() || 'main';
      ui.githubPushing = true; ui.otaStatusMsg = `🏷️ Publicando en ${repo}...`; render();
      try {
        const headers = { 'Accept': 'application/vnd.github.v3+json', 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' };
        try { const rr = await fetch(`https://api.github.com/repos/${repo}?t=${Date.now()}`, { headers, cache: 'no-store' }); if (rr.ok) { const rm = await rr.json(); if (rm && rm.default_branch) branch = rm.default_branch; } } catch (e) {}
        const ver = (versionTag || getCurrentInstalledVersion()).replace(/^v/i, ''), tagName = 'v' + ver;
        let html = localStorage.getItem('KRONO_OTA_CUSTOM_HTML') || ('<!DOCTYPE html>' + document.documentElement.outerHTML);
        if (rawHtmlOrJson) {
          const tr = String(rawHtmlOrJson).trim();
          if (tr.startsWith('{')) { const p = JSON.parse(tr); if (p.html) html = p.html; }
          else if (tr.includes('<html')) html = tr;
        }
        html = sanitizeHtmlForGitHubUpload(html);
        await pushSingleFileToGitHub(repo, branch, state.githubFilePath || 'ota.json', JSON.stringify({ version: ver, html }, null, 2), `🏷️ Release ${tagName}`, token);
        await pushSingleFileToGitHub(repo, branch, 'index.html', html, `🏷️ index.html ${tagName}`, token);
        await pushStateToGitHubCloud(false);
        let relId = null;
        try { const cr = await fetch(`https://api.github.com/repos/${repo}/releases/tags/${encodeURIComponent(tagName)}?t=${Date.now()}`, { headers, cache: 'no-store' }); if (cr.ok) { const rj = await cr.json(); if (rj && rj.id) relId = rj.id; } } catch (e) {}
        const relPayload = { tag_name: tagName, target_commitish: branch, name: `Krono Finanzas ${tagName}`, body: customNotes || ui.releaseNotesInput || `Release ${tagName}`, draft: false, prerelease: false };
        const relRes = await fetch(relId ? `https://api.github.com/repos/${repo}/releases/${relId}` : `https://api.github.com/repos/${repo}/releases`, { method: relId ? 'PATCH' : 'POST', headers, body: JSON.stringify(relPayload) });

    function getTotals() {
      const rate = Number(state.exchangeRate) || 41.5;
      let totalUYU = 0, monthIncomeUYU = 0, monthExpenseUYU = 0;
      state.accounts.forEach(a => { totalUYU += a.currency === 'USD' ? a.balance * rate : a.balance; });
      state.transactions.forEach(t => { const v = t.currency === 'USD' ? t.amount * rate : t.amount; if (t.type === 'income') monthIncomeUYU += v; else monthExpenseUYU += v; });
      return { totalUYU, totalUSD: totalUYU / rate, monthIncomeUYU, monthExpenseUYU, savingsRate: monthIncomeUYU > 0 ? Math.max(0, Math.round(((monthIncomeUYU - monthExpenseUYU) / monthIncomeUYU) * 100)) : 0 };

    function formatMoney(amount, currency = 'UYU') { return (currency === 'USD' ? 'US$ ' : '$ ') + Number(amount || 0).toLocaleString('es-UY', { maximumFractionDigits: currency === 'USD' ? 2 : 0 }); }
    function addTransaction({ title, amount, currency = 'UYU', type = 'expense', category = 'Comida y Súper', accountId = null, fromExternal = false }) {
      const numAmount = Math.abs(Number(amount) || 0); if (numAmount <= 0) return null;
      const targetAcc = state.accounts.find(a => a.id === accountId) || state.accounts[0];
      if (targetAcc) {
        const delta = type === 'income' ? numAmount : -numAmount;
        if (targetAcc.currency === currency) targetAcc.balance += delta;
        else if (currency === 'USD' && targetAcc.currency === 'UYU') targetAcc.balance += delta * state.exchangeRate;
        else if (currency === 'UYU' && targetAcc.currency === 'USD') targetAcc.balance += delta / state.exchangeRate;
      }
      const now = new Date();
      const tx = {
        id: 'tx_' + Date.now() + '_' + Math.floor(Math.random() * 1000),
        title: (fromExternal ? '🤖 ' : '') + (title || 'Movimiento'), amount: numAmount, currency, type, category,
        accountId: targetAcc ? targetAcc.id : 'acc_uyu', accountName: targetAcc ? targetAcc.name : 'Cuenta Principal',
        date: `${String(now.getDate()).padStart(2,'0')}/${String(now.getMonth()+1).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`,
        timestamp: Date.now()
      };
      state.transactions.unshift(tx);
      spawnFloatingBurst(`${type === 'income' ? '+' : '-'}${formatMoney(numAmount, currency)} (${targetAcc ? targetAcc.name.split(' ')[0] : ''})`, type === 'income');
      saveState(true, true); return tx;
    }

    function findAccountMentionInText(rawText) {

          <div class="flex flex-wrap justify-between gap-2"><div><div class="text-xs font-bold uppercase text-emerald-300">☁️ Sincronización PC ↔ Celular</div><h2 class="text-lg font-extrabold text-white">Código: <span class="mono text-emerald-300">${state.syncCode}</span></h2></div><span class="text-xs px-3 py-1 rounded-full bg-emerald-500/20 text-emerald-200 mono">${ui.syncStatusText}</span></div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
            <input type="text" value="${escapeAttr(state.syncCode)}" onchange="state.syncCode=this.value.trim().toUpperCase();saveState(false,false);pullStateFromGitHubCloud(true);" class="bg-slate-950/70 border border-white/15 rounded-xl px-3 py-2 text-xs text-white mono" />
            <div class="flex gap-2"><button onclick="pullStateFromGitHubCloud(true)" class="spring-btn flex-1 py-2 rounded-xl bg-emerald-400 text-slate-950 font-extrabold text-xs">🔄 Descargar</button><button onclick="pushStateToGitHubCloud(true)" class="spring-btn flex-1 py-2 rounded-xl bg-cyan-500/25 border border-cyan-400/40 text-cyan-200 font-extrabold text-xs">☁️ Subir</button></div>

        <div class="glass-97 rounded-3xl p-6 border-2 border-cyan-400/40 space-y-3">
          <div class="flex flex-wrap justify-between gap-2"><div><div class="text-xs font-bold uppercase text-cyan-300">🏷️ Motor OTA GitHub Releases</div><h2 class="text-xl font-extrabold text-white">Versión: <span class="mono text-cyan-300">v${ver}</span></h2></div><label class="flex items-center gap-2 text-xs text-slate-200"><input type="checkbox" ${state.autoCheckOta?'checked':''} onchange="state.autoCheckOta=this.checked;saveState(false,false);" class="accent-cyan-400" /> Auto-OTA</label></div>

            <button onclick="downloadCleanIndexHtmlForApk()" class="spring-btn px-4 py-2 rounded-xl bg-emerald-500/25 border border-emerald-400/50 text-emerald-200 font-extrabold text-xs">📄 Bajar index.html</button>
            <button onclick="ui.showOtaModal=true;render();" class="spring-btn px-4 py-2 rounded-xl bg-white/10 text-slate-200 font-bold text-xs">📋 Pegar OTA</button>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

    function renderActiveSection(totals, displayTotal) {
      const anim = getTabAnimationClass();
      if (ui.activeTab === 'movements') return renderMovementsTab(anim);
      if (ui.activeTab === 'accounts') return renderAccountsTab(anim);
      if (ui.activeTab === 'budgets') return renderBudgetsTab(anim);
      if (ui.activeTab === 'debts') return renderDebtsTab(anim);
      if (ui.activeTab === 'settings') return renderSettingsTab(anim);
      return renderDashboardTab(totals, displayTotal, anim);
    }

    function render() {
      const root = document.getElementById('app-root'); if (!root) return;
      const totals = getTotals(), displayTotal = ui.displayCurrency === 'USD' ? formatMoney(totals.totalUSD, 'USD') : formatMoney(totals.totalUYU, 'UYU'), ver = getCurrentInstalledVersion();
      const nav = [{ id:'dashboard', icon:'🏠', label:'Panel' }, { id:'movements', icon:'⚡', label:'Movimientos' }, { id:'accounts', icon:'🏦', label:'Cuentas' }, { id:'budgets', icon:'🎯', label:'Presupuestos' }, { id:'debts', icon:'📌', label:'Pendientes' }, { id:'settings', icon:'⚙️', label:'Ajustes' }];

        <div class="flex-1 flex flex-col md:flex-row w-full max-w-[100vw] min-h-[100dvh] overflow-x-hidden">

              <div>
                <div class="flex justify-between items-center mb-6"><div><h1 class="text-xl font-extrabold text-white">Krono Finanzas</h1><span class="text-[11px] font-bold mono text-cyan-300">v${ver} • Sync Activo</span></div><span class="krono-sync-dot w-2.5 h-2.5 rounded-full bg-emerald-400"></span></div>

              </div>
              <div class="space-y-2 pt-4 border-t border-white/10">
                <div class="text-[11px] text-slate-400 mono flex justify-between"><span>${state.syncCode}</span><span>${ui.syncStatusText}</span></div>
                <button onclick="syncAllNow(true)" class="spring-btn w-full py-2.5 rounded-xl bg-cyan-500/20 border border-cyan-400/40 text-cyan-200 font-bold text-xs">🔄 Sincronizar</button>
                <button onclick="ui.showOtaModal=true;render();" class="spring-btn w-full py-2.5 rounded-xl bg-emerald-500/20 border border-emerald-400/40 text-emerald-200 font-bold text-xs">🚀 Panel OTA</button>
              </div>
            </div>
          </aside>
          <main class="flex-1 md:pl-64 w-full max-w-[100vw] pb-24 md:pb-8 overflow-x-hidden">
            <div class="max-w-5xl mx-auto p-3.5 sm:p-4 md:p-6 w-full overflow-x-hidden">
              <div class="flex md:hidden justify-between items-center gap-2 mb-4">
                <div class="min-w-0"><div class="flex items-center gap-2"><h1 class="text-lg font-extrabold text-white truncate">Krono Finanzas</h1><span class="krono-sync-dot w-2 h-2 rounded-full bg-emerald-400"></span></div><span class="text-[10px] font-bold mono text-cyan-300 block truncate">v${ver} • ${ui.syncStatusText}</span></div>
                <div class="flex gap-1.5 shrink-0"><button onclick="syncAllNow(true)" class="spring-btn px-2.5 py-1.5 rounded-xl glass-97 text-xs text-cyan-200 font-bold">🔄 Sync</button><button onclick="ui.showOtaModal=true;render();" class="spring-btn px-2.5 py-1.5 rounded-xl glass-97 text-xs text-emerald-200 font-bold">🚀 OTA</button></div>
              </div>
              ${renderActiveSection(totals, displayTotal)}
            </div>
          </main>
          <nav class="md:hidden fixed bottom-0 inset-x-0 z-40 p-2"><div class="glass-97 rounded-2xl px-1.5 py-1.5 flex justify-around">${nav.map(i => `<button onclick="switchTab('${i.id}');" class="flex flex-col items-center py-1.5 px-2 rounded-xl text-[10px] font-bold ${ui.activeTab===i.id?'bg-cyan-400 text-slate-950':'text-slate-300'}"><span class="text-base">${i.icon}</span><span class="mt-0.5">${i.label}</span></button>`).join('')}</div></nav>
        </div>
        ${ui.inputModal ? `<div class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4"><form onsubmit="submitInputModal(event)" class="glass-97 w-full max-w-md rounded-3xl p-6 border-2 border-cyan-400/50 space-y-3 animate-pop-elastic"><h3 class="text-base font-extrabold text-white">${ui.inputModal.title}</h3><label class="text-xs text-slate-300 block">${ui.inputModal.label}</label><input id="krono-input-modal-field" type="${ui.inputModal.inputType}" ${ui.inputModal.inputType==='number'?'step="any"':''} required value="${escapeAttr(ui.inputModal.value)}" placeholder="${escapeAttr(ui.inputModal.placeholder)}" class="w-full bg-slate-950/80 border border-cyan-400/40 rounded-xl px-3.5 py-2.5 text-sm text-white ${ui.inputModal.inputType==='number'?'mono':''} focus:outline-none focus:border-cyan-400" /><div class="flex justify-end gap-2 pt-2"><button type="button" onclick="closeInputModal()" class="px-4 py-2 text-xs text-slate-300 hover:text-white">Cancelar</button><button type="submit" class="spring-btn px-5 py-2 rounded-xl bg-cyan-400 text-slate-950 font-extrabold text-xs">Guardar</button></div></form></div>` : ''}
        ${ui.showOtaModal ? `<div class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4"><div class="glass-97 w-full max-w-xl rounded-3xl p-5 border-2 border-cyan-400/50 animate-pop-elastic"><div class="flex justify-between mb-2"><h3 class="text-base font-extrabold text-white">🚀 Actualizador OTA</h3><span class="text-xs mono text-cyan-300">v${ver}</span></div><input id="ota-release-notes" type="text" placeholder="Notas opcionales..." value="${escapeAttr(ui.releaseNotesInput)}" oninput="ui.releaseNotesInput=this.value;" class="w-full bg-slate-950/80 border border-white/15 rounded-xl px-3 py-2 text-xs text-white mb-2" /><textarea id="ota-paste-box" rows="5" placeholder='Pegá aquí el JSON {"version","html"}...' class="w-full p-3 rounded-2xl bg-slate-950/80 border border-white/15 text-xs text-white mono mb-3"></textarea>${ui.otaStatusMsg ? `<div class="p-2.5 rounded-xl bg-slate-950/80 text-xs text-cyan-200 mb-3">${ui.otaStatusMsg}</div>` : ''}<div class="flex justify-between gap-2"><button onclick="publishGitHubRelease()" class="px-3 py-2 rounded-xl bg-violet-500/30 text-violet-200 font-bold text-xs">🏷️ Publicar Release</button><div class="flex gap-2"><button onclick="ui.showOtaModal=false;render();" class="px-4 py-2 text-xs text-slate-300">Cerrar</button><button onclick="handleOtaPasteApply()" class="px-5 py-2 rounded-xl bg-cyan-400 text-slate-950 font-extrabold text-xs">Instalar</button></div></div></div></div>` : ''}

        ${ui.showNewAccountModal ? `<div class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4"><form onsubmit="createAccount(event)" class="glass-97 w-full max-w-md rounded-3xl p-6 space-y-3 animate-pop-elastic"><h3 class="text-base font-extrabold text-white">🏦 Nueva Cuenta</h3><input id="acc-name" type="text" required placeholder="Nombre" class="w-full bg-slate-950/80 border border-white/15 rounded-xl px-3 py-2.5 text-xs text-white" /><div class="grid grid-cols-3 gap-2"><select id="acc-currency" class="bg-slate-950/80 border border-white/15 rounded-xl px-3 py-2.5 text-xs text-white"><option value="UYU">UYU</option><option value="USD">USD</option></select><input id="acc-balance" type="number" step="0.01" placeholder="Saldo" class="bg-slate-950/80 border border-white/15 rounded-xl px-3 py-2.5 text-xs text-white mono" /><input id="acc-icon" type="text" value="🏦" class="bg-slate-950/80 border border-white/15 rounded-xl px-3 py-2.5 text-xs text-white text-center" /></div><div class="flex justify-end gap-2 pt-2"><button type="button" onclick="ui.showNewAccountModal=false;render();" class="px-4 py-2 text-xs text-slate-300">Cancelar</button><button type="submit" class="px-5 py-2 rounded-xl bg-cyan-400 text-slate-950 font-extrabold text-xs">Crear</button></div></form></div>` : ''}
        ${ui.showTransferModal ? `<div class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4"><form onsubmit="handleTransferSubmit(event)" class="glass-97 w-full max-w-md rounded-3xl p-6 space-y-3 animate-pop-elastic"><h3 class="text-base font-extrabold text-white">⇄ Transferir</h3><select id="tr-from" class="w-full bg-slate-950/80 border border-white/15 rounded-xl px-3 py-2.5 text-xs text-white">${state.accounts.map(a => `<option value="${a.id}">Desde: ${a.name}</option>`).join('')}</select><select id="tr-to" class="w-full bg-slate-950/80 border border-white/15 rounded-xl px-3 py-2.5 text-xs text-white">${state.accounts.map((a,i) => `<option value="${a.id}" ${i===1?'selected':''}>Hacia: ${a.name}</option>`).join('')}</select><input id="tr-amount" type="number" step="0.01" required placeholder="Monto" class="w-full bg-slate-950/80 border border-white/15 rounded-xl px-3 py-2.5 text-xs text-white mono" /><div class="flex justify-end gap-2 pt-2"><button type="button" onclick="ui.showTransferModal=false;render();" class="px-4 py-2 text-xs text-slate-300">Cancelar</button><button type="submit" class="px-5 py-2 rounded-xl bg-cyan-400 text-slate-950 font-extrabold text-xs">Transferir</button></div></form></div>` : ''}
        ${ui.showNewDebtModal ? `<div class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4"><form onsubmit="handleCreateDebtSubmit(event)" class="glass-97 w-full max-w-md rounded-3xl p-6 space-y-3 animate-pop-elastic"><h3 class="text-base font-extrabold text-white">📌 Nuevo Crédito / Deuda / Pendiente</h3><input id="db-title" type="text" required placeholder="Concepto (ej: Préstamo, cuota, factura)" class="w-full bg-slate-950/80 border border-white/15 rounded-xl px-3 py-2.5 text-xs text-white" /><input id="db-counterparty" type="text" placeholder="Persona o entidad (opcional)" class="w-full bg-slate-950/80 border border-white/15 rounded-xl px-3 py-2.5 text-xs text-white" /><div class="grid grid-cols-2 gap-2"><select id="db-kind" class="bg-slate-950/80 border border-white/15 rounded-xl px-3 py-2.5 text-xs text-white"><option value="credit">📈 Crédito / Me deben (+)</option><option value="debt">📉 Deuda / Debo (-)</option></select><select id="db-currency" class="bg-slate-950/80 border border-white/15 rounded-xl px-3 py-2.5 text-xs text-white"><option value="UYU">$ UYU</option><option value="USD">US$ USD</option></select></div><div class="grid grid-cols-2 gap-2"><input id="db-amount" type="number" step="0.01" required placeholder="Monto" class="bg-slate-950/80 border border-white/15 rounded-xl px-3 py-2.5 text-xs text-white mono" /><input id="db-due" type="text" placeholder="Vencimiento (ej: 30/11)" class="bg-slate-950/80 border border-white/15 rounded-xl px-3 py-2.5 text-xs text-white" /></div><input id="db-notes" type="text" placeholder="Notas adicionales (opcional)" class="w-full bg-slate-950/80 border border-white/15 rounded-xl px-3 py-2.5 text-xs text-white" /><div class="flex justify-end gap-2 pt-2"><button type="button" onclick="ui.showNewDebtModal=false;render();" class="px-4 py-2 text-xs text-slate-300">Cancelar</button><button type="submit" class="px-5 py-2 rounded-xl bg-cyan-400 text-slate-950 font-extrabold text-xs">Guardar</button></div></form></div>` : ''}
        ${ui.showNewBudgetModal ? `<div class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4"><form onsubmit="handleCreateBudgetSubmit(event)" class="glass-97 w-full max-w-md rounded-3xl p-6 space-y-3 animate-pop-elastic"><h3 class="text-base font-extrabold text-white">🎯 Nueva Categoría</h3><input id="bg-name" type="text" required placeholder="Nombre" class="w-full bg-slate-950/80 border border-white/15 rounded-xl px-3 py-2.5 text-xs text-white" /><div class="grid grid-cols-2 gap-2"><input id="bg-limit" type="number" required placeholder="Tope ($ UYU)" class="bg-slate-950/80 border border-white/15 rounded-xl px-3 py-2.5 text-xs text-white mono" /><input id="bg-icon" type="text" value="🎯" class="bg-slate-950/80 border border-white/15 rounded-xl px-3 py-2.5 text-xs text-white text-center" /></div><div class="flex justify-end gap-2 pt-2"><button type="button" onclick="ui.showNewBudgetModal=false;render();" class="px-4 py-2 text-xs text-slate-300">Cancelar</button><button type="submit" class="px-5 py-2 rounded-xl bg-cyan-400 text-slate-950 font-extrabold text-xs">Crear</button></div></form></div>` : ''}
        ${ui.showVoiceWidgetOverlay ? `<div class="fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-xl flex items-center justify-center p-4 text-center"><div class="glass-97 w-full max-w-sm rounded-3xl p-6 border-2 border-cyan-400/50 animate-pop-elastic space-y-3"><div class="text-4xl">${ui.isListening?'🎙️':'✨'}</div><h3 class="text-base font-extrabold text-white">${ui.isListening?'Escuchando...':'Dictado por Voz'}</h3>${ui.voiceHintMsg?`<p class="text-[11px] text-amber-200 bg-amber-500/15 rounded-xl p-2">${ui.voiceHintMsg}</p>`:''}<input id="voice-overlay-manual-input" type="text" value="${escapeAttr(ui.voiceTranscript)}" oninput="ui.voiceTranscript=this.value;" onkeydown="if(event.key==='Enter')submitVoiceOverlayInput();" placeholder="Dictá con el teclado o escribí..." class="w-full bg-slate-950/85 border border-cyan-400/50 rounded-2xl px-3.5 py-3 text-xs text-white" /><div class="grid grid-cols-2 gap-2.5 pt-1"><button onclick="submitVoiceOverlayInput()" class="spring-btn py-2.5 rounded-2xl bg-cyan-400 text-slate-950 font-extrabold text-xs">✅ Procesar</button><button onclick="stopVoiceCapture();ui.showVoiceWidgetOverlay=false;render();" class="py-2.5 rounded-2xl bg-white/10 text-slate-300 font-bold text-xs">Cerrar</button></div></div></div>` : ''}
