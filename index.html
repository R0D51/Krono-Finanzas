    function getDebtRemainingAmount(d) {
      const total = Math.max(0, Number(d.amount || 0));
      const instCount = Math.max(1, parseInt(d.installmentsCount, 10) || 1);
      const paidInst = Math.max(0, Math.min(instCount, parseInt(d.paidInstallments, 10) || 0));
      if (instCount > 1) {
        const perInst = total / instCount;
        const remInst = Math.max(0, instCount - paidInst);
        return Number((perInst * remInst).toFixed(2));
      }
      return total;
    }
    function getDebtInstallmentValue(d) {
      const total = Math.max(0, Number(d.amount || 0));
      const instCount = Math.max(1, parseInt(d.installmentsCount, 10) || 1);
      return Number((total / instCount).toFixed(2));
    }
    function getDebtInstrumentLabel(d) {

    function getDebtsCardsBreakdown() {
      const rate = Number(state.exchangeRate) || 41.5;
      const list = Array.isArray(state.debts) ? state.debts : [];
      const savedCards = Array.isArray(state.creditCards) ? state.creditCards : [];
      const map = new Map();
      savedCards.forEach(sc => {
        const label = (sc.name || '').trim();
        if (!label) return;
        const key = label.toLowerCase();
        if (!map.has(key)) {
          map.set(key, {
            id: sc.id,
            name: label,
            currency: sc.currency || 'UYU',
            closingDay: sc.closingDay || '',
            dueDay: sc.dueDay || '',
            totalItems: 0,
            pendingItems: 0,
            activeInstallmentPlans: 0,
            remainingInstallmentsTotal: 0,
            nextPaymentUYU: 0,
            remainingBalanceUYU: 0,
            dueDates: sc.dueDay ? ['Día ' + sc.dueDay] : []
          });
        }
      });
      list.forEach(d => {
        const cardLabel = getDebtInstrumentLabel(d);
        if (!cardLabel) return;
        const key = cardLabel.toLowerCase();
        if (!map.has(key)) {
          map.set(key, {
            name: cardLabel,
            totalItems: 0,
            pendingItems: 0,
            activeInstallmentPlans: 0,
            remainingInstallmentsTotal: 0,
            nextPaymentUYU: 0,
            remainingBalanceUYU: 0,
            dueDates: []
          });
        }
        const entry = map.get(key);
        entry.totalItems++;
        if (d.status !== 'settled') {
          entry.pendingItems++;
          const rem = getDebtRemainingAmount(d);
          const instCount = Math.max(1, parseInt(d.installmentsCount, 10) || 1);
          const paidInst = Math.max(0, Math.min(instCount, parseInt(d.paidInstallments, 10) || 0));
          const remInst = Math.max(0, instCount - paidInst);
          const instVal = getDebtInstallmentValue(d);
          const payNow = instCount > 1 ? Math.min(rem, instVal) : rem;
          const sign = d.kind === 'credit' ? -1 : 1;
          entry.remainingBalanceUYU += sign * (d.currency === 'USD' ? rem * rate : rem);
          entry.nextPaymentUYU += sign * (d.currency === 'USD' ? payNow * rate : payNow);
          if (instCount > 1) {
            entry.activeInstallmentPlans++;
            entry.remainingInstallmentsTotal += remInst;
          }
          if (d.dueDate && !entry.dueDates.includes(d.dueDate)) {
            entry.dueDates.push(d.dueDate);
          }
        }
      });
      return Array.from(map.values());

    function getDebtsSummary() {
      const rate = Number(state.exchangeRate) || 41.5;
      const list = Array.isArray(state.debts) ? state.debts : [];
      let pendingCreditsUYU = 0, pendingDebtsUYU = 0, pendingCount = 0, nextInstallmentsUYU = 0;
      list.forEach(d => {
        if (d.status !== 'settled') {
          pendingCount++;
          const rem = getDebtRemainingAmount(d);
          const v = (d.currency === 'USD' ? rem * rate : rem);
          const instVal = getDebtInstallmentValue(d);
          const instV = (d.currency === 'USD' ? instVal * rate : instVal);
          if (d.kind === 'credit') {
            pendingCreditsUYU += v;
          } else {
            pendingDebtsUYU += v;
            nextInstallmentsUYU += instV;
          }
        }
      });
      let nextCardClosingUYU = 0;
      list.forEach(d => {
        if (d.status !== 'settled' && d.kind !== 'credit') {
          const hasCard = d.paymentMethod === 'credit_card' || Boolean((d.cardName || '').trim()) || /tarjeta|visa|master|oca|amex|cabal|zodimac|brou|itau|itaú|santander|bbva|scotia|prex|midinero/i.test(`${d.title || ''} ${d.counterparty || ''}`);

            const instVal = getDebtInstallmentValue(d);
            const payClosing = instCount > 1 ? Math.min(rem, instVal) : rem;
            nextCardClosingUYU += (d.currency === 'USD' ? payClosing * rate : payClosing);
          }
        }
      });
      return {
        pendingCreditsUYU,
        pendingDebtsUYU,
        nextInstallmentsUYU,
        nextCardClosingUYU,
        netPendingUYU: pendingCreditsUYU - pendingDebtsUYU,
        pendingCount

              paymentMethod: cardName ? 'credit_card' : (instC > 1 ? 'installment_plan' : 'general'),
              cardName,
              installmentsCount: instC,
              paidInstallments: 0,
              amount: totalAmt,
              currency: cur,
              kind,
              dueDate: act.dueDate || '',
              status: 'pending',
              notes: '',
              createdAt: Date.now()
            });
            summaryParts.push(`${kind === 'credit' ? 'Crédito' : 'Deuda'}: ${act.title || ''} (${formatMoney(totalAmt, cur)})`);
            executedAny = true;
          }
        } else if (act.op === 'query_balance') {
          const acc = act.accountQuery ? matchAccount(act.accountQuery) : null;
          const reply = acc ? `El saldo de ${acc.name} es de ${formatMoney(acc.balance, acc.currency)}.` : `Tu patrimonio total es de ${formatMoney(getTotals().totalUYU, 'UYU')}.`;
          ui.geminiResponse = { mode: 'query', prompt: originalText, reply, items: [] };
          speakText(reply);
          render();
          return true;
        }
      }

      if (executedAny) {
        const reply = (fromExternal ? '[Google Tasks] ' : '') + summaryParts.join(' • ');
        ui.geminiResponse = { mode: 'action', prompt: originalText, reply, items: [] };
        speakText(reply);
        saveState(true, true);
        return true;
      }
      return false;
    }

    function processGeminiCommand(rawInput, fromExternal = false) {
      if (!rawInput || !rawInput.trim()) return;
      const text = rawInput.replace(/_/g, ' ').replace(/\+/g, ' ').trim().replace(/^(?:hey\s+gemini|hola\s+gemini|gemini|tarea\s+|en\s+krono\s+|krono[:\s,-]*)+/i, '').trim();
      const lower = normalizeStr(text);

      // Optional AI interpreter path when user configures a Gemini API key in Settings
      if (state.geminiApiKey && String(state.geminiApiKey).trim()) {
        ui.lastInterpreterMode = '🧠 IA Gemini (consultando...)';
        interpretWithGeminiAI(text, state.geminiApiKey)
          .then(actions => {
            if (actions && actions.length && executeStructuredActions(actions, text, fromExternal)) {
              ui.lastInterpreterMode = '🧠 IA Gemini';
              if (ui.geminiResponse) {
                ui.geminiResponse.reply = '[🧠 IA Gemini] ' + ui.geminiResponse.reply;
                render();
              }
              return;
            }
            ui.lastInterpreterMode = '⚙️ Parámetros locales (fallback IA)';
            runLocalRuleInterpreter(text, lower, fromExternal);
            if (ui.geminiResponse && !ui.geminiResponse.reply.startsWith('[⚙️')) {
              ui.geminiResponse.reply = '[⚙️ Local] ' + ui.geminiResponse.reply;
              render();
            }
          })
          .catch((err) => {
            ui.lastInterpreterMode = '⚙️ Parámetros locales (sin respuesta IA)';
            runLocalRuleInterpreter(text, lower, fromExternal);
            if (ui.geminiResponse && !ui.geminiResponse.reply.startsWith('[⚙️')) {
              ui.geminiResponse.reply = '[⚙️ Local] ' + ui.geminiResponse.reply;
              render();
            }
          });
        return;
      }

      ui.lastInterpreterMode = '⚙️ Parámetros locales';
      runLocalRuleInterpreter(text, lower, fromExternal);
      if (ui.geminiResponse && !ui.geminiResponse.reply.startsWith('[⚙️')) {
        ui.geminiResponse.reply = '[⚙️ Local] ' + ui.geminiResponse.reply;
        render();
      }
    }

    function runLocalRuleInterpreter(text, lower, fromExternal = false) {
      if ((lower.includes('actualiza') || lower.includes('release')) && lower.includes('app')) {
        ui.showOtaModal = true;
        checkGitHubReleaseOtaUpdate(true);
        render();
        return;
      }

      if (lower.includes('cuanto') || lower.includes('saldo') || lower.includes('patrimonio')) {
        const sp = findAccountMentionInText(text);
        const reply = sp ? `El saldo de ${sp.name} es de ${formatMoney(sp.balance, sp.currency)}.` : `Tu patrimonio total es de ${formatMoney(getTotals().totalUYU, 'UYU')}.`;
        ui.geminiResponse = { mode: 'query', prompt: text, reply, items: [] };
        speakText(reply);
        render();
        return;
      }

      function isCardOrDebtItem(item) {
        if (!item || item.status === 'settled') return false;
        const label = `${getDebtInstrumentLabel(item)} ${item.title || ''} ${item.counterparty || ''}`;
        return item.paymentMethod === 'credit_card' || Boolean((item.cardName || '').trim()) || /tarjeta|visa|master|oca|amex|cabal|zodimac|brou|itau|itaú|santander|bbva|scotia|prex|midinero|cuota|prestamo|préstamo|deuda/i.test(normalizeStr(label));
      }

      function findMatchingCardName(normText) {
        const cards = Array.isArray(state.creditCards) ? state.creditCards : [];
        for (const c of cards) {
          const cNorm = normalizeStr(c.name || '');
          if (cNorm && normText.includes(cNorm)) return c.name;
          const bNorm = normalizeStr(c.bank || '');
          if (bNorm && bNorm.length >= 3 && normText.includes(bNorm)) return c.name;
        }
        const m = normText.match(/\b(?:(?:itau|itaú|brou|santander|bbva|scotia|hsbc|prex|midinero|zodimac)\s+(?:visa|mastercard|master|oca|amex|cabal|recompensa)|visa|mastercard|master|oca|american\s+express|amex|cabal|brou\s+recompensa|santander|itau|itaú|bbva|scotia|hsbc|prex|midinero|zodimac)\b/i);
        return m ? m[0].replace(/\b\w/g, ch => ch.toUpperCase()) : '';
      }

      function resolvePaymentSourceAccount(normText) {
        if (/\b(efectivo|billetera|cash|contado|en mano|monedero|plata en efectivo)\b/i.test(normText)) {
          return state.accounts.find(a => a.id === 'acc_cash' || /efectivo|billetera|cash|mano/i.test(normalizeStr(a.name))) || state.accounts[0];
        }
        const mentioned = findAccountMentionInText(normText);
        if (mentioned) return mentioned;
        return state.accounts.find(a => a.id === 'acc_cash' || /efectivo|billetera|cash/i.test(normalizeStr(a.name))) || state.accounts[0];
      }

      const isPayingCardOrDebt = /\b(?:pague|pagar|abone|abonar|cancele|cancelar|liquide|liquidar|salde|saldar)\b/i.test(lower)
        && /\b(?:tarjeta|visa|mastercard|master|oca|amex|cabal|zodimac|cierre|resumen|deuda|cuota|cuotas|prestamo|préstamo|credito|crédito|pendiente)\b/i.test(lower);

      if (isPayingCardOrDebt) {
        if (!Array.isArray(state.debts)) state.debts = [];
        const rate = Number(state.exchangeRate) || 41.5;
        const explicitAmount = extractSmartAmount(lower);
        const targetCardName = findMatchingCardName(lower);
        const sourceAcc = resolvePaymentSourceAccount(lower);
        const targetCurrency = detectCurrencyInText(lower) || (sourceAcc ? sourceAcc.currency : (state.defaultCurrency || 'UYU'));

        // Distinguish whether user asked for THIS MONTH'S installments ("cuotas de este mes" / "cuotas del mes" / "cuota de este mes" / "cuotas") vs FULL BALANCE ("todo" / "saldo total")
        const wantsCurrentInstallmentsOnly = /\b(?:cuotas?\s+(?:de\s+este\s+mes|del\s+mes|mensuales?|corrientes?)|la\s+cuota|las\s+cuotas)\b/i.test(lower)
          && !/\b(?:todo|toda|todas|saldo\s+total|totalidad|completo|completa)\b/i.test(lower);

        let candidateDebts = state.debts.filter(d => {
          if (d.status === 'settled' || d.kind === 'credit') return false;
          if (targetCardName) {
            const dLabel = normalizeStr(getDebtInstrumentLabel(d) || `${d.title || ''} ${d.counterparty || ''}`);
            return dLabel.includes(normalizeStr(targetCardName)) || normalizeStr(targetCardName).includes(dLabel);
          }
          return isCardOrDebtItem(d);
        });

        if (!candidateDebts.length && !explicitAmount) {
          candidateDebts = state.debts.filter(d => d.status !== 'settled' && d.kind !== 'credit');
        }

        let calcUYU = 0;
        if (explicitAmount > 0) {
          calcUYU = (targetCurrency === 'USD' ? explicitAmount * rate : explicitAmount);
        } else if (wantsCurrentInstallmentsOnly) {
          candidateDebts.forEach(d => {
            const rem = getDebtRemainingAmount(d);
            if (rem <= 0.01) return;
            const instCount = Math.max(1, parseInt(d.installmentsCount, 10) || 1);
            const instVal = getDebtInstallmentValue(d);
            const payNow = instCount > 1 ? Math.min(rem, instVal) : rem;
            calcUYU += (d.currency === 'USD' ? payNow * rate : payNow);
          });
        } else {
          candidateDebts.forEach(d => {
            const rem = getDebtRemainingAmount(d);
            calcUYU += (d.currency === 'USD' ? rem * rate : rem);
          });
        }

        const payAmountTargetCur = explicitAmount > 0
          ? explicitAmount
          : (targetCurrency === 'USD' ? Number((calcUYU / rate).toFixed(2)) : Math.round(calcUYU));

        if (payAmountTargetCur > 0) {
          let deductInAccCur = payAmountTargetCur;

          }

          let remainingCreditToApplyUYU = (targetCurrency === 'USD' ? payAmountTargetCur * rate : payAmountTargetCur);
          let settledCount = 0;

          for (const d of candidateDebts) {

            const remItem = getDebtRemainingAmount(d);

            const remItemUYU = (d.currency === 'USD' ? remItem * rate : remItem);
            const instCount = Math.max(1, parseInt(d.installmentsCount, 10) || 1);
            const paidInst = Math.max(0, Math.min(instCount, parseInt(d.paidInstallments, 10) || 0));
            const instVal = getDebtInstallmentValue(d);
            const instValUYU = (d.currency === 'USD' ? instVal * rate : instVal);

            if (wantsCurrentInstallmentsOnly && !explicitAmount) {
              // Advance ONLY 1 installment (current month) per debt/card plan, keeping future installments pending
              const payNow = instCount > 1 ? Math.min(remItem, instVal) : remItem;
              const nextPaid = Math.min(instCount, paidInst + 1);

                settledCount++;
              } else {

              }

              const newPaid = Math.min(instCount, paidInst + coveredInst);
              const appliedVal = Number((instVal * coveredInst).toFixed(2));
              d.paidInstallments = newPaid;

                d.status = 'settled';
                d.settledAt = Date.now();
                settledCount++;
              } else {
                updatedInstallmentsCount++;
              }
              remainingCreditToApplyUYU = Math.max(0, remainingCreditToApplyUYU - (d.currency === 'USD' ? appliedVal * rate : appliedVal));
            } else if (explicitAmount > 0) {
              const paidUYU = Math.min(remItemUYU, remainingCreditToApplyUYU);
              const paidInDebtCur = (d.currency === 'USD' ? paidUYU / rate : paidUYU);
              const newRemInDebtCur = Math.max(0, remItem - paidInDebtCur);

                d.status = 'settled';
                d.settledAt = Date.now();
                settledCount++;
              } else {
                if (instCount > 1) {
                  const remInstLeft = Math.max(1, instCount - paidInst);
                  const newInstVal = Number((newRemInDebtCur / remInstLeft).toFixed(2));
                  d.amount = Number((newInstVal * instCount).toFixed(2));
                } else {
                  d.amount = Number(newRemInDebtCur.toFixed(2));
                }
                updatedInstallmentsCount++;
              }
              remainingCreditToApplyUYU = 0;
            }
          }

          if (sourceAcc) {
            sourceAcc.balance = Number((sourceAcc.balance - deductInAccCur).toFixed(2));
          }
          const now = new Date();
          const cardLabelDesc = targetCardName ? ` (${targetCardName})` : ' (Tarjeta de crédito)';
          const modeLabelDesc = (wantsCurrentInstallmentsOnly && !explicitAmount) ? 'Cuotas del mes ' : 'Pago ';
          const accLabelDesc = sourceAcc ? sourceAcc.name : 'Efectivo';
          const tx = {
            id: 'tx_' + Date.now() + '_' + Math.floor(Math.random() * 1000),
            title: (fromExternal ? '🤖 ' : '') + `${modeLabelDesc}tarjeta${cardLabelDesc} con ${accLabelDesc}`,
            amount: payAmountTargetCur,
            currency: targetCurrency,
            type: 'expense',
            category: 'Tarjeta / Crédito',
            accountId: sourceAcc ? sourceAcc.id : 'acc_cash',
            accountName: accLabelDesc,
            date: `${String(now.getDate()).padStart(2,'0')}/${String(now.getMonth()+1).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`,
            timestamp: Date.now()

          state.transactions.unshift(tx);

          const dsAfter = getDebtsSummary();
          const reply = (fromExternal ? '[Google Tasks] ' : '')
            + `${modeLabelDesc}registrado: ${formatMoney(payAmountTargetCur, targetCurrency)}${cardLabelDesc} desde ${accLabelDesc}. `
            + `Saldados: ${settledCount}, cuotas actualizadas: ${updatedInstallmentsCount}. `
            + `Próximo pago de cuotas: ${formatMoney(dsAfter.nextInstallmentsUYU, 'UYU')} y saldo en ${accLabelDesc}: ${sourceAcc ? formatMoney(sourceAcc.balance, sourceAcc.currency) : '$ 0'}.`;

      }

      const debtIntentMatch = /(?:^|\b)(?:debo|me\s+deben|me\s+debe|prestamo|préstamo|credito|crédito|deuda|cuota\s+pendiente|pendiente\s+de\s+(?:cobro|pago)|tarjeta\s+de\s+credito|en\s+\d+\s+cuotas?|\d+\s+cuotas?)(?:\b|$)/i.test(lower) && !/\b(?:pague|pagué|cobre|cobré|gaste|gasté)\b/i.test(lower);

          const cardMatch = workText.match(/\b(?:(?:itau|itaú|brou|santander|bbva|scotia|hsbc|prex|midinero)\s+(?:visa|mastercard|master|oca|amex|cabal|recompensa)|visa|mastercard|master|oca|american\s+express|amex|cabal|brou\s+recompensa|santander|itau|itaú|bbva|scotia|hsbc|prex|midinero)\b/i);
          const cardName = cardMatch ? cardMatch[0].replace(/\b\w/g, c => c.toUpperCase()) : '';
          const paymentMethod = cardName || /\btarjeta\b/i.test(lower) ? 'credit_card' : (installmentsCount > 1 ? 'installment_plan' : (/\bprestamo|préstamo\b/i.test(lower) ? 'personal' : 'general'));
          const currency = detectCurrencyInText(lower) || state.defaultCurrency || 'UYU';
          const totalAmount = (installmentsCount > 1 && perInstallmentPhrase) ? Number((rawAmount * installmentsCount).toFixed(2)) : rawAmount;
          let cleanTitle = workText.replace(/(\d{1,3}(?:[.,]\d{3})+(?:[.,]\d+)?|\d+(?:[.,]\d+)?)\s*(mil)?/gi, ' ')
            .replace(/\b(un mil|dos mil|tres mil|cuatro mil|cinco mil|diez mil|quince mil|veinte mil|quinientos|seiscientos|setecientos|ochocientos|novecientos|cien|doscientos|trescientos|cuatrocientos|mil)\b/gi, ' ')
            .replace(/\b(?:debo|me\s+deben|me\s+debe|prestamo|préstamo|credito|crédito|deuda|cuota|cuotas|por\s+cuota|cada\s+cuota|tarjeta|pesos|dólares|dolares|dolar|dólar|usd|uyu|en|de|por|a|con|la|el)\b/gi, ' ')
            .replace(/\$/g, ' ').replace(/\s+/g, ' ').trim();
          cleanTitle = cleanTitle ? (cleanTitle.charAt(0).toUpperCase() + cleanTitle.slice(1)) : (cardName ? `Compra ${cardName}` : (isCredit ? 'Crédito pendiente' : 'Deuda pendiente'));
          state.debts.unshift({

          });
          const cuotaInfo = installmentsCount > 1 ? ` en ${installmentsCount} cuotas (${formatMoney(Number((totalAmount / installmentsCount).toFixed(2)), currency)} c/u)` : '';

          const reply = (fromExternal ? '[Google Tasks] ' : '') + `Agregué ${isCredit ? 'crédito' : 'deuda'} pendiente: ${cleanTitle} (${formatMoney(totalAmount, currency)}${cuotaInfo}${cardInfo}).`;

          speakText(reply);

      const rawSegs = text.split(/(?:;|\s+y\s+(?=[^,.;]*?(?:\d|mil|quinientos|cien))|,(?=[^,.;]*?(?:\d|mil|quinientos|cien)))/i).map(s => s.trim()).filter(Boolean);
      const created = [];
      (rawSegs.length ? rawSegs : [text]).forEach(seg => {

          else if (/\b(nafta|uber|boleto|auto|bus|omnibus|taxi|peaje)\b/i.test(sLower)) cat = 'Transporte y Nafta';

        }
        let title = seg.replace(/^(hey\s+gemini|gemini|krono)[,\s]*/i,'').replace(/(\d{1,3}(?:[.,]\d{3})+(?:[.,]\d+)?|\d+(?:[.,]\d+)?)\s*(mil)?/gi,' ').replace(/\b(un mil|dos mil|tres mil|cuatro mil|cinco mil|diez mil|quince mil|veinte mil|quinientos|seiscientos|setecientos|ochocientos|novecientos|cien|doscientos|trescientos|cuatrocientos|mil)\b/gi,' ').replace(/\b(me\s+(?:entro|entró|ingreso|ingresó|ingresaron|pagaron|depositaron|transfirieron|dieron|devolvieron)|ingresaron|ahorr[eé]|ahorrar|gané|gane|cobr[eé]|cobre|ingres[eé]|ingrese|recib[ií]|recibi|deposit[eé]|deposite|gasté|gaste|pagué|pague|compré|compre|en|de|por|con|desde|pesos|dólares|dolares|dolar|dólar|usd|uyu)\b/gi,' ').replace(/\$/g, ' ');
        title = stripAccountPhrasesFromTitle(title);
        title = title ? (title.charAt(0).toUpperCase() + title.slice(1)) : (isInc ? 'Ingreso' : cat);
        const tx = addTransaction({ title, amount, currency, type: txType, category: cat, accountId: targetAcc ? targetAcc.id : null, fromExternal });
        if (tx) created.push(tx);

      if (created.length > 0) {
