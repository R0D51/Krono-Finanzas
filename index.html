  <script>
    // KRONO OTA BOOTLOADER v5.4.0 — GITHUB RELEASES + GEMINI EXTERNO
    (function() {
      if (window.__KRONO_OTA_BOOTED__) return;
      const params = new URLSearchParams(window.location.search);
      if (params.get('safe_reset_ota') === '1') {
        localStorage.removeItem('KRONO_OTA_CUSTOM_HTML');
        localStorage.removeItem('KRONO_OTA_VERSION_TAG');
        localStorage.removeItem('KRONO_OTA_LIVE_CSS');
        localStorage.removeItem('KRONO_OTA_LIVE_JS');
        return;
      }
      try {
        let customHtml = localStorage.getItem('KRONO_OTA_CUSTOM_HTML');
        if (customHtml && !window.__KRONO_RUNNING_OTA__) {
          const trimmed = customHtml.trim();
          if (trimmed.startsWith('{')) {
            try {
              const parsed = JSON.parse(trimmed);
              if (parsed && parsed.html) {
                customHtml = parsed.html;
                localStorage.setItem('KRONO_OTA_CUSTOM_HTML', customHtml);
                if (parsed.version) localStorage.setItem('KRONO_OTA_VERSION_TAG', String(parsed.version).replace(/^v/i, ''));
              }
            } catch (err) {}
          }
          if (customHtml.includes('<!DOCTYPE html>') || customHtml.includes('<html')) {
            window.__KRONO_RUNNING_OTA__ = true;
            window.__KRONO_OTA_BOOTED__ = true;
            document.open();
            document.write(customHtml);
            document.close();
            return;
          }
        }
      } catch (e) { console.error('OTA Bootloader fallback:', e); }
    })();
  </script>

      return (localStorage.getItem('KRONO_OTA_VERSION_TAG') || APP_BASE_VERSION).replace(/^v/i, '');

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          return {

            ...parsed,
            githubRepo: (parsed.githubRepo && parsed.githubRepo.trim()) ? parsed.githubRepo.trim() : DEFAULT_GH_REPO,
            githubToken: (parsed.githubToken && parsed.githubToken.trim()) ? parsed.githubToken.trim() : DEFAULT_GH_TOKEN,

    function saveState(broadcast = true) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      if (broadcast && syncChannel) syncChannel.postMessage({ type: 'SYNC_STATE', state });
      if (broadcast && state.cloudWebhookUrl) pushToCloudBridge();
      triggerSyncPulse();
      render();
    }

    if (syncChannel) {
      syncChannel.onmessage = (ev) => {
        if (ev.data.type === 'SYNC_STATE') { state = ev.data.state; triggerSyncPulse(); render(); }
        else if (ev.data.type === 'OTA_APPLIED') { window.location.reload(); }
      };
    }

    window.addEventListener('storage', (ev) => {
      if (ev.key === STORAGE_KEY && ev.newValue) { state = JSON.parse(ev.newValue); triggerSyncPulse(); render(); }
      else if (ev.key === 'KRONO_OTA_CUSTOM_HTML' || ev.key === 'KRONO_OTA_VERSION_TAG') { window.location.reload(); }
    });

    function triggerSyncPulse() {
      ui.lastSyncPulse = true;
      setTimeout(() => { ui.lastSyncPulse = false; }, 900);
    }

    function spawnFloatingBurst(text, isPositive = true) {
      const c = document.getElementById('burst-container');
      if (!c) return;
      const el = document.createElement('div');
      el.className = `animate-burst px-4 py-2 rounded-2xl font-bold mono text-sm shadow-2xl border backdrop-blur-xl ${isPositive ? 'bg-emerald-500/25 border-emerald-400/50 text-emerald-200' : 'bg-rose-500/25 border-rose-400/50 text-rose-200'}`;
      el.textContent = text;
      c.appendChild(el);
      setTimeout(() => el.remove(), 1400);
    }

    function loadLivePatches() {
      try {
        const liveCss = localStorage.getItem('KRONO_OTA_LIVE_CSS');
        const styleEl = document.getElementById('krono-live-custom-css');
        if (liveCss && styleEl) styleEl.textContent = liveCss;
        const liveJs = localStorage.getItem('KRONO_OTA_LIVE_JS');
        if (liveJs) { const fn = new Function(liveJs); fn(); }
      } catch (e) { console.error('Live patch error:', e); }
    }

    function isNewerVersion(remoteVer, currentVer) {
      if (!remoteVer) return false;
      const cleanR = String(remoteVer).replace(/^v/i, '').trim();
      const cleanC = String(currentVer).replace(/^v/i, '').trim();
      if (cleanR === cleanC) return false;
      const partsR = cleanR.split(/[-.]/).map(n => parseInt(n, 10));
      const partsC = cleanC.split(/[-.]/).map(n => parseInt(n, 10));
      if (partsR.slice(0, 3).every(n => !isNaN(n)) && partsC.slice(0, 3).every(n => !isNaN(n))) {
        const len = Math.max(partsR.length, partsC.length);
        for (let i = 0; i < len; i++) {
          const r = isNaN(partsR[i]) ? 0 : partsR[i];
          const c = isNaN(partsC[i]) ? 0 : partsC[i];
          if (r > c) return true;
          if (r < c) return false;
        }
        return false;
      }
      return cleanR !== cleanC;
    }

    function cleanRepoSlug() {
      return (state.githubRepo || DEFAULT_GH_REPO).trim().replace(/^https?:\/\/github\.com\//i, '').replace(/\/+$/, '');
    }

    function getActiveGitHubToken() {
      return (state.githubToken && state.githubToken.trim()) ? state.githubToken.trim() : DEFAULT_GH_TOKEN;
    }

    function getGitHubHeaders(acceptType = 'application/vnd.github.v3+json') {
      const headers = { 'Accept': acceptType };
      const tk = getActiveGitHubToken();
      if (tk) headers['Authorization'] = `Bearer ${tk}`;
      return headers;
    }

    function sanitizeHtmlForGitHubUpload(htmlStr) {
      const tk = getActiveGitHubToken();
      if (!tk || !htmlStr.includes(tk)) return htmlStr;
      return htmlStr.split(tk).join("' + ['ghp_','QvsuFE2J5rMXd0','tnOrAudlHjShqWOs','14AnDf'].join('') + '");
    }

    async function applyOtaUpdatePayload(rawPayload, versionLabel = null, broadcastToCloud = true, publishRelease = false, releaseNotes = '') {
      if (!rawPayload || !String(rawPayload).trim()) return false;
      const text = String(rawPayload).trim();
      let targetHtml = null;
      let targetVersion = (versionLabel || ('OTA-' + new Date().toLocaleDateString('es-UY'))).replace(/^v/i, '');

      if (text.startsWith('{')) {
        try {
          const parsed = JSON.parse(text);
          if (parsed.version) targetVersion = String(parsed.version).replace(/^v/i, '').trim();
          if ((parsed.css || parsed.js) && !parsed.html) {
            if (parsed.css) localStorage.setItem('KRONO_OTA_LIVE_CSS', parsed.css);
            if (parsed.js) localStorage.setItem('KRONO_OTA_LIVE_JS', parsed.js);
            localStorage.setItem('KRONO_OTA_VERSION_TAG', targetVersion);
            localStorage.setItem('KRONO_OTA_LAST_DATE', new Date().toLocaleString('es-UY'));
            loadLivePatches();
            ui.otaStatusMsg = `✅ Parche v${targetVersion} aplicado en vivo.`;
            spawnFloatingBurst(`🏷️ Release v${targetVersion}`, true);
            if (broadcastToCloud && state.cloudWebhookUrl) await pushOtaToCloud(text, targetVersion);
            if (publishRelease && cleanRepoSlug() && getActiveGitHubToken()) {
              await publishGitHubRelease(text, targetVersion, releaseNotes || `Parche OTA v${targetVersion}`);
            }
            render();
            return true;
          }
          if (parsed.html && (parsed.html.includes('<!DOCTYPE html>') || parsed.html.includes('<html'))) {
            targetHtml = parsed.html;
          }
        } catch (err) {
          ui.otaStatusMsg = '❌ Error al leer el bloque JSON OTA.';
          render();
          return false;
        }
      } else if (text.includes('<!DOCTYPE html>') || text.includes('<html')) {
        targetHtml = text;
        const verMatch = text.match(/APP_BASE_VERSION\s*=\s*['"]([^'"]+)['"]/);
        if (!versionLabel && verMatch && verMatch[1]) targetVersion = verMatch[1].replace(/^v/i, '');
      }

      if (targetHtml) {
        localStorage.setItem('KRONO_OTA_CUSTOM_HTML', targetHtml);
        localStorage.setItem('KRONO_OTA_VERSION_TAG', targetVersion);
        localStorage.setItem('KRONO_OTA_LAST_DATE', new Date().toLocaleString('es-UY'));
        state.lastReleaseTag = 'v' + targetVersion;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        ui.otaStatusMsg = `✅ Release v${targetVersion} instalado. Reiniciando...`;
        spawnFloatingBurst(`🏷️ Release v${targetVersion}`, true);
        const fullJsonPacket = JSON.stringify({ version: targetVersion, html: targetHtml }, null, 2);
        if (broadcastToCloud && state.cloudWebhookUrl) await pushOtaToCloud(fullJsonPacket, targetVersion);
        if (publishRelease && cleanRepoSlug() && getActiveGitHubToken()) {
          await publishGitHubRelease(targetHtml, targetVersion, releaseNotes || `Release OTA Krono Finanzas v${targetVersion}`);
        }
        if (syncChannel) syncChannel.postMessage({ type: 'OTA_APPLIED' });
        setTimeout(() => window.location.reload(), 650);
        return true;
      }

      ui.otaStatusMsg = '⚠️ Formato OTA no reconocido. Pegá un JSON {"version","html"} o HTML completo.';
      render();
      return false;
    }

    function rollbackFactoryOta() {
      if (!confirm('¿Restaurar la versión base de fábrica? Tus cuentas y movimientos no se borrarán.')) return;
      localStorage.removeItem('KRONO_OTA_CUSTOM_HTML');
      localStorage.removeItem('KRONO_OTA_VERSION_TAG');
      localStorage.removeItem('KRONO_OTA_LIVE_CSS');
      localStorage.removeItem('KRONO_OTA_LIVE_JS');
      setTimeout(() => window.location.reload(), 450);
    }

    async function fetchPayloadForReleaseTag(repo, releaseObj) {
      const tagName = releaseObj.tag_name || (state.githubBranch || 'main');
      const filePath = (state.githubFilePath || 'ota.json').trim().replace(/^\/+/, '') || 'ota.json';
      const candidates = [filePath, 'ota.json', 'index.html'];

      for (const file of candidates) {
        try {
          const apiUrl = `https://api.github.com/repos/${repo}/contents/${file}?ref=${encodeURIComponent(tagName)}&t=${Date.now()}`;
          const res = await fetch(apiUrl, { headers: getGitHubHeaders(), cache: 'no-store' });
          if (res.ok) {
            const meta = await res.json();
            if (meta && meta.content) {
              return decodeURIComponent(escape(atob(meta.content.replace(/\s/g, ''))));
            }
          }
        } catch (e) {}
        try {
          const rawUrl = `https://raw.githubusercontent.com/${repo}/${encodeURIComponent(tagName)}/${file}?t=${Date.now()}`;
          const rawRes = await fetch(rawUrl, { cache: 'no-store' });
          if (rawRes.ok) return await rawRes.text();
        } catch (e) {}
      }

      if (Array.isArray(releaseObj.assets) && releaseObj.assets.length > 0) {
        const asset = releaseObj.assets.find(a => a.name.endsWith('.json') || a.name.endsWith('.html')) || releaseObj.assets[0];
        if (asset && asset.url) {
          const assetRes = await fetch(asset.url, { headers: getGitHubHeaders('application/octet-stream'), cache: 'no-store' });
          if (assetRes.ok) return await assetRes.text();
        }
      }
      return '';
    }

    async function checkGitHubReleaseOtaUpdate(manual = false) {
      const repo = cleanRepoSlug();
      if (!repo) {
        if (manual) { ui.otaStatusMsg = '⚠️ Escribí tu repositorio (usuario/repo) en Ajustes -> GitHub Releases.'; render(); }
        return false;
      }
      ui.otaChecking = true;
      if (manual) { ui.otaStatusMsg = `🔍 Consultando último Release en GitHub (${repo})...`; render(); }

      try {
        const endpoint = state.githubIncludePrereleases
          ? `https://api.github.com/repos/${repo}/releases?per_page=5&t=${Date.now()}`
          : `https://api.github.com/repos/${repo}/releases/latest?t=${Date.now()}`;
        const relRes = await fetch(endpoint, { headers: getGitHubHeaders(), cache: 'no-store' });

        if (!relRes.ok) {
          if (relRes.status === 404) {
            ui.otaChecking = false;
            if (manual) ui.otaStatusMsg = 'ℹ️ Aún no hay un Release en el repositorio. Publicando Release inicial...';
            render();
            if (getActiveGitHubToken()) return await publishGitHubRelease();
          }
          throw new Error('GitHub HTTP ' + relRes.status);
        }

        const relData = await relRes.json();
        const latestRelease = Array.isArray(relData) ? relData[0] : relData;
        if (!latestRelease || !latestRelease.tag_name) {
          throw new Error('No se encontró ningún tag de Release activo.');
        }

        const remoteTag = String(latestRelease.tag_name).trim();
        const remoteVer = remoteTag.replace(/^v/i, '');
        const currentVer = getCurrentInstalledVersion();

        state.lastReleaseTag = remoteTag;
        state.lastReleaseNotes = latestRelease.body || latestRelease.name || '';
        state.lastGithubSync = new Date().toLocaleTimeString('es-UY', { hour: '2-digit', minute: '2-digit' });
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));

        if (isNewerVersion(remoteVer, currentVer)) {
          ui.otaStatusMsg = `🏷️ Nuevo Release ${remoteTag} detectado. Descargando actualización...`;
          render();
          const payload = await fetchPayloadForReleaseTag(repo, latestRelease);
          if (!payload) throw new Error(`El Release ${remoteTag} no contiene ${state.githubFilePath || 'ota.json'} ni index.html.`);
          ui.otaChecking = false;
          await applyOtaUpdatePayload(payload, remoteVer, false, false);
          return true;
        } else {
          ui.otaChecking = false;
          if (manual) ui.otaStatusMsg = `✅ Estás en el último Release oficial (${remoteTag}) en ${repo}. Verificado a las ${state.lastGithubSync}.`;
          render();
          return false;
        }
      } catch (e) {
        ui.otaChecking = false;
        if (manual) ui.otaStatusMsg = `⚠️ GitHub Releases: ${e.message}`;
        render();
        return false;
      }
    }

    async function pushSingleFileToGitHub(repo, branch, path, contentStr, commitMsg, token) {
      const apiUrl = `https://api.github.com/repos/${repo}/contents/${path}`;
      const headers = {
        'Accept': 'application/vnd.github.v3+json',
        'Authorization': `Bearer ${token}`,
        'Content-Type': 'application/json'
      };
      let existingSha = null;
      try {
        const getRes = await fetch(`${apiUrl}?ref=${encodeURIComponent(branch)}&t=${Date.now()}`, { headers, cache: 'no-store' });
        if (getRes.ok) {
          const getJson = await getRes.json();
          if (getJson && getJson.sha) existingSha = getJson.sha;
        }
      } catch (e) {}

      const safeContent = sanitizeHtmlForGitHubUpload(contentStr);
      const base64Content = btoa(unescape(encodeURIComponent(safeContent)));
      const bodyObj = { message: commitMsg, content: base64Content, branch };
      if (existingSha) bodyObj.sha = existingSha;

      const putRes = await fetch(apiUrl, { method: 'PUT', headers, body: JSON.stringify(bodyObj) });
      if (!putRes.ok) {
        const errData = await putRes.json().catch(() => ({}));
        throw new Error(errData.message || ('Error al subir ' + path + ': HTTP ' + putRes.status));
      }
      return await putRes.json();
    }

    async function publishGitHubRelease(rawHtmlOrJson = null, versionTag = null, customNotes = '') {
      const repo = cleanRepoSlug();
      const token = getActiveGitHubToken();
      let branch = (state.githubBranch || 'main').trim() || 'main';
      const otaPath = (state.githubFilePath || 'ota.json').trim().replace(/^\/+/, '') || 'ota.json';

      if (!repo || !token) {
        ui.otaStatusMsg = '⚠️ Repositorio o Token de GitHub no configurados.';
        render();
        return false;
      }

      ui.githubPushing = true;
      ui.otaStatusMsg = `🏷️ Conectando con ${repo} y publicando Release...`;
      render();

      try {
        const headers = {
          'Accept': 'application/vnd.github.v3+json',
          'Authorization': `Bearer ${token}`,
          'Content-Type': 'application/json'
        };

        try {
          const repoRes = await fetch(`https://api.github.com/repos/${repo}?t=${Date.now()}`, { headers, cache: 'no-store' });
          if (repoRes.ok) {
            const repoMeta = await repoRes.json();
            if (repoMeta && repoMeta.default_branch) {
              branch = repoMeta.default_branch;
              state.githubBranch = branch;
            }
          }
        } catch (e) {}

        const ver = (versionTag || getCurrentInstalledVersion()).replace(/^v/i, '');
        const tagName = 'v' + ver;
        let currentHtml = localStorage.getItem('KRONO_OTA_CUSTOM_HTML') || ('<!DOCTYPE html>' + document.documentElement.outerHTML);
        if (rawHtmlOrJson) {
          const trimmed = String(rawHtmlOrJson).trim();
          if (trimmed.startsWith('{')) {
            const parsed = JSON.parse(trimmed);
            if (parsed.html) currentHtml = parsed.html;
          } else if (trimmed.includes('<html')) {
            currentHtml = trimmed;
          }
        }
        currentHtml = sanitizeHtmlForGitHubUpload(currentHtml);

        const otaJsonPayload = JSON.stringify({ version: ver, html: currentHtml }, null, 2);
        await pushSingleFileToGitHub(repo, branch, otaPath, otaJsonPayload, `🏷️ Krono Finanzas Release ${tagName} (${otaPath})`, token);
        await pushSingleFileToGitHub(repo, branch, 'index.html', currentHtml, `🏷️ Krono Finanzas Release ${tagName} (index.html)`, token);

        const notes = customNotes || ui.releaseNotesInput || `Release oficial Krono Finanzas ${tagName}: Conexión con Google Gemini externo (botón de encendido Android) y soporte multi-cuenta.`;

        let existingReleaseId = null;
        try {
          const checkRel = await fetch(`https://api.github.com/repos/${repo}/releases/tags/${encodeURIComponent(tagName)}?t=${Date.now()}`, { headers, cache: 'no-store' });
          if (checkRel.ok) {
            const relJson = await checkRel.json();
            if (relJson && relJson.id) existingReleaseId = relJson.id;
          }
        } catch (e) {}

        const releasePayload = {
          tag_name: tagName,
          target_commitish: branch,
          name: `Krono Finanzas ${tagName}`,
          body: notes,
          draft: false,
          prerelease: false
        };

        const relUrl = existingReleaseId
          ? `https://api.github.com/repos/${repo}/releases/${existingReleaseId}`
          : `https://api.github.com/repos/${repo}/releases`;
        const relMethod = existingReleaseId ? 'PATCH' : 'POST';

        const relRes = await fetch(relUrl, { method: relMethod, headers, body: JSON.stringify(releasePayload) });
        if (!relRes.ok) {
          const errData = await relRes.json().catch(() => ({}));
          throw new Error(errData.message || ('Error creando Release HTTP ' + relRes.status));
        }

        localStorage.setItem('KRONO_AUTO_DEPLOYED_VER', ver);
        state.lastReleaseTag = tagName;
        state.lastReleaseNotes = notes;
        state.lastGithubSync = new Date().toLocaleTimeString('es-UY', { hour: '2-digit', minute: '2-digit' });
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        ui.githubPushing = false;
        ui.otaStatusMsg = `✅ Release ${tagName} subido y publicado en https://github.com/${repo}/releases`;
        spawnFloatingBurst(`🏷️ Subido ${tagName} a GitHub`, true);
        render();
        return true;
      } catch (e) {
        ui.githubPushing = false;
        ui.otaStatusMsg = `❌ Error al publicar en ${repo}: ${e.message}`;
        spawnFloatingBurst('Error GitHub Release', false);
        render();
        return false;
      }
    }

    // ==========================================================================
    // PUENTE DE COMANDOS EXTERNOS DE GOOGLE GEMINI (BOTÓN DE ENCENDIDO ANDROID)
    // ==========================================================================
    async function consumePendingExternalCommands(pendingList) {
      if (!Array.isArray(pendingList) || pendingList.length === 0) return;
      if (!Array.isArray(state.processedCommandIds)) state.processedCommandIds = [];
      if (!Array.isArray(state.externalCommandHistory)) state.externalCommandHistory = [];

      const newlyProcessedIds = [];
      let executedCount = 0;

      for (const item of pendingList) {
        const cmdId = (typeof item === 'object' && item !== null) ? (item.id || ('cmd_' + item.timestamp)) : ('raw_' + btoa(unescape(encodeURIComponent(String(item)))).slice(0, 16));
        const rawCmd = (typeof item === 'object' && item !== null) ? (item.command || item.text || item.title || '') : String(item || '');
        if (!rawCmd.trim() || state.processedCommandIds.includes(cmdId)) continue;

        // Limpiar prefijo "Krono" si viene de Google Tasks ("Krono gasté 850 en súper")
        const cleanCmd = rawCmd.replace(/^(?:tarea\s+)?krono[:\s,-]*/i, '').trim();
        if (cleanCmd) {
          processGeminiCommand(cleanCmd, true);
          state.processedCommandIds.push(cmdId);
          if (state.processedCommandIds.length > 200) state.processedCommandIds.shift();
          state.externalCommandHistory.unshift({
            id: cmdId,
            command: cleanCmd,
            date: new Date().toLocaleTimeString('es-UY', { hour: '2-digit', minute: '2-digit' })
          });
          if (state.externalCommandHistory.length > 15) state.externalCommandHistory.pop();
          newlyProcessedIds.push(cmdId);
          executedCount++;
        }
      }

      if (executedCount > 0) {
        saveState(true);
        spawnFloatingBurst(`🤖 Gemini Externo (${executedCount})`, true);
        // Confirmar al puente Google Apps Script que limpie los comandos ya procesados
        if (state.cloudWebhookUrl) {
          try {
            await fetch(state.cloudWebhookUrl.trim(), {
              method: 'POST',
              mode: 'no-cors',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                action: 'ack_commands',
                syncCode: state.syncCode,
                commandIds: newlyProcessedIds
              })
            });
          } catch (e) {}
        }
      }
    }

    // Detector de comandos "Krono: ..." copiados desde Google Gemini al portapapeles
    async function checkClipboardForExternalGemini() {
      if (!state.autoClipboardGemini || !navigator.clipboard || !navigator.clipboard.readText) return;
      try {
        const clipText = (await navigator.clipboard.readText() || '').trim();
        if (/^krono[:\s-]+(?:gast|pagu|compr|cobr|ingres|recib)/i.test(clipText)) {
          const hash = 'clip_' + btoa(unescape(encodeURIComponent(clipText))).slice(0, 20);
          if (!state.processedCommandIds.includes(hash)) {
            state.processedCommandIds.push(hash);
            const cleanCmd = clipText.replace(/^krono[:\s-]+/i, '').trim();
            processGeminiCommand(cleanCmd, true);
            spawnFloatingBurst('📋 Comando Gemini Detectado', true);
          }
        }
      } catch (e) {}
    }

    function getGoogleAppsScriptBridgeV54Code() {
      return `// ============================================================================
// PUENTE KRONO FINANZAS v5.4.0 — GOOGLE GEMINI (BOTÓN ENCENDIDO) + GOOGLE TASKS
// ============================================================================
// Cómo usarlo fuera de la app:
// 1. Mantené presionado el botón de encendido en Android para hablar con Gemini.
// 2. Decile: "Agregá una tarea que diga Krono gasté 850 en súper con efectivo"
// 3. Este script cosecha la tarea de Google Tasks y la envía a Krono Finanzas.

function harvestGoogleTasksForKrono(syncCode, props) {
  var queueKey = 'PENDING_CMDS_' + syncCode;
  var queue = [];
  try {
    var rawQ = props.getProperty(queueKey);
    if (rawQ) queue = JSON.parse(rawQ);
  } catch (e) { queue = []; }

  try {
    if (typeof Tasks !== 'undefined' && Tasks.Tasklists) {
      var lists = Tasks.Tasklists.list().items;
      if (lists && lists.length > 0) {
        for (var l = 0; l < lists.length; l++) {
          var tasks = Tasks.Tasks.list(lists[l].id, { showCompleted: false }).items;
          if (!tasks) continue;
          for (var t = 0; t < tasks.length; t++) {
            var title = (tasks[t].title || '').trim();
            var notes = (tasks[t].notes || '').trim();
            var fullText = (title + ' ' + notes).trim();
            if (/^krono\b/i.test(fullText)) {
              var cleanCommand = fullText.replace(/^krono[:\s,-]*/i, '').trim();
              if (cleanCommand) {
                queue.push({
                  id: 'gtask_' + tasks[t].id,
                  command: cleanCommand,
                  source: 'gemini_power_button',
                  timestamp: new Date().getTime()
                });
              }
              Tasks.Tasks.remove(lists[l].id, tasks[t].id);
            }
          }
        }
      }
    }
  } catch (err) {}

  props.setProperty(queueKey, JSON.stringify(queue));
  return queue;
}

function doGet(e) {
  var syncCode = (e && e.parameter && e.parameter.syncCode) ? e.parameter.syncCode : '${state.syncCode || 'KRONO-7749'}';
  var props = PropertiesService.getScriptProperties();

  // Permite encolar un comando externo vía GET (?action=enqueue&cmd=gaste+850+en+super)
  if (e && e.parameter && e.parameter.cmd) {
    var qKey = 'PENDING_CMDS_' + syncCode;
    var curQ = JSON.parse(props.getProperty(qKey) || '[]');
    curQ.push({ id: 'url_' + new Date().getTime(), command: e.parameter.cmd, timestamp: new Date().getTime() });
    props.setProperty(qKey, JSON.stringify(curQ));
  }

  var pendingCommands = harvestGoogleTasksForKrono(syncCode, props);
  var rawState = props.getProperty('STATE_' + syncCode);
  var otaPayload = props.getProperty('OTA_PAYLOAD_' + syncCode);
  var otaVersion = props.getProperty('OTA_VERSION_' + syncCode);

  return ContentService.createTextOutput(JSON.stringify({
    syncCode: syncCode,
    state: rawState ? JSON.parse(rawState) : null,
    otaVersion: otaVersion || null,
    otaPayload: otaPayload || null,
    pendingCommands: pendingCommands
  })).setMimeType(ContentService.MimeType.JSON);
}

function doPost(e) {
  var body = JSON.parse(e.postData.contents);
  var syncCode = body.syncCode || '${state.syncCode || 'KRONO-7749'}';
  var props = PropertiesService.getScriptProperties();
  var qKey = 'PENDING_CMDS_' + syncCode;

  if (body.action === 'enqueue_command' && body.command) {
    var q = JSON.parse(props.getProperty(qKey) || '[]');
    q.push({ id: 'post_' + new Date().getTime(), command: body.command, timestamp: new Date().getTime() });
    props.setProperty(qKey, JSON.stringify(q));
    return ContentService.createTextOutput(JSON.stringify({ ok: true, queued: true })).setMimeType(ContentService.MimeType.JSON);
  }

  if (body.action === 'ack_commands' && Array.isArray(body.commandIds)) {
    var currentQ = JSON.parse(props.getProperty(qKey) || '[]');
    var remaining = currentQ.filter(function(item) { return body.commandIds.indexOf(item.id) === -1; });
    props.setProperty(qKey, JSON.stringify(remaining));
    return ContentService.createTextOutput(JSON.stringify({ ok: true })).setMimeType(ContentService.MimeType.JSON);
  }

  if (body.action === 'publish_ota' && body.otaPayload) {
    props.setProperty('OTA_PAYLOAD_' + syncCode, body.otaPayload);
    props.setProperty('OTA_VERSION_' + syncCode, body.otaVersion || 'OTA-Live');
    return ContentService.createTextOutput(JSON.stringify({ ok: true, otaPublished: true })).setMimeType(ContentService.MimeType.JSON);
  }

  if (body.state) {
    props.setProperty('STATE_' + syncCode, JSON.stringify(body.state));
  }
  return ContentService.createTextOutput(JSON.stringify({ ok: true })).setMimeType(ContentService.MimeType.JSON);
}`;
    }

    // LÓGICA FINANCIERA BIMONETARIA
    function getTotals() {
      const rate = Number(state.exchangeRate) || 41.5;
      let totalUYU = 0, monthIncomeUYU = 0, monthExpenseUYU = 0;
      state.accounts.forEach(acc => { totalUYU += acc.currency === 'USD' ? acc.balance * rate : acc.balance; });
      state.transactions.forEach(tx => {
        const valUYU = tx.currency === 'USD' ? tx.amount * rate : tx.amount;
        if (tx.type === 'income') monthIncomeUYU += valUYU; else monthExpenseUYU += valUYU;
      });
      return {
        totalUYU,
        totalUSD: totalUYU / rate,
        monthIncomeUYU,
        monthExpenseUYU,
        savingsRate: monthIncomeUYU > 0 ? Math.max(0, Math.round(((monthIncomeUYU - monthExpenseUYU) / monthIncomeUYU) * 100)) : 0
      };
    }

    function formatMoney(amount, currency = 'UYU') {
      return (currency === 'USD' ? 'US$ ' : '$ ') + Number(amount || 0).toLocaleString('es-UY', { maximumFractionDigits: currency === 'USD' ? 2 : 0 });
    }

    function addTransaction({ title, amount, currency = 'UYU', type = 'expense', category = 'Comida y Súper', accountId = null, fromExternal = false }) {
      const numAmount = Math.abs(Number(amount) || 0);
      if (numAmount <= 0) return null;
      let targetAcc = state.accounts.find(a => a.id === accountId) || state.accounts[0];
      if (targetAcc) {
        const delta = type === 'income' ? numAmount : -numAmount;
        if (targetAcc.currency === currency) targetAcc.balance += delta;
        else if (currency === 'USD' && targetAcc.currency === 'UYU') targetAcc.balance += delta * state.exchangeRate;
        else if (currency === 'UYU' && targetAcc.currency === 'USD') targetAcc.balance += delta / state.exchangeRate;
      }
      const now = new Date();
      const newTx = {
        id: 'tx_' + Date.now() + '_' + Math.floor(Math.random() * 1000),
        title: (fromExternal ? '🤖 ' : '') + (title || 'Transacción'),
        amount: numAmount,
        currency,
        type,
        category,
        accountId: targetAcc ? targetAcc.id : 'acc_uyu',
        accountName: targetAcc ? targetAcc.name : 'Cuenta Principal',
        date: `${String(now.getDate()).padStart(2, '0')}/${String(now.getMonth() + 1).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`,
        timestamp: Date.now()
      };
      state.transactions.unshift(newTx);
      spawnFloatingBurst(`${type === 'income' ? '+' : '-'}${formatMoney(numAmount, currency)} (${targetAcc ? targetAcc.name.split(' ')[0] : ''})`, type === 'income');
      saveState(true);
      return newTx;
    }

    function deleteTransaction(txId) {
      const idx = state.transactions.findIndex(t => t.id === txId);
      if (idx === -1) return;
      const tx = state.transactions[idx];
      const acc = state.accounts.find(a => a.id === tx.accountId);
      if (acc) {
        const reverseDelta = tx.type === 'income' ? -tx.amount : tx.amount;
        if (acc.currency === tx.currency) acc.balance += reverseDelta;
        else if (tx.currency === 'USD' && acc.currency === 'UYU') acc.balance += reverseDelta * state.exchangeRate;
        else if (tx.currency === 'UYU' && acc.currency === 'USD') acc.balance += reverseDelta / state.exchangeRate;
      }
      state.transactions.splice(idx, 1);
      saveState(true);
    }

    // MOTOR NLP GEMINI v5.4.0 — MULTI-CUENTA + RECEPCIÓN EXTERNA
    function normalizeStr(str) {
      return String(str || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    }

    function findAccountMentionInText(rawText) {
      const norm = normalizeStr(rawText);
      if (!norm) return null;

      let bestAcc = null;
      let bestScore = 0;
      const ignoredWords = ['cuenta', 'mis', 'los', 'las', 'del', 'con', 'por', 'para', 'una', 'caja'];

      state.accounts.forEach(acc => {
        const accNorm = normalizeStr(acc.name);
        if (norm.includes(accNorm)) {
          if (accNorm.length + 10 > bestScore) {
            bestScore = accNorm.length + 10;
            bestAcc = acc;
          }
        }
        const tokens = accNorm.split(/[^a-z0-9]+/).filter(t => t.length >= 3 && !ignoredWords.includes(t));
        let score = 0;
        tokens.forEach(tok => {
          const regex = new RegExp(`(^|[^a-z0-9])${tok}([^a-z0-9]|$)`, 'i');
          if (regex.test(norm)) score += tok.length;
        });
        if (score > bestScore) {
          bestScore = score;
          bestAcc = acc;
        }
      });
      if (bestAcc) return bestAcc;

      const cashPatterns = /\b(efectivo|billetera|cash|contado|en mano|plata en mano|monedero)\b/i;
      if (cashPatterns.test(norm)) {
        const cashAcc = state.accounts.find(a => a.id === 'acc_cash' || /efectivo|billetera|cash|mano|monedero/i.test(normalizeStr(a.name)));
        if (cashAcc) return cashAcc;
      }

      const usdSavingPatterns = /\b(ahorro|ahorros|cuenta dolares|cuenta en dolares|cuenta usd|ahorro dolares)\b/i;
      if (usdSavingPatterns.test(norm)) {
        const usdAcc = state.accounts.find(a => a.id === 'acc_usd' || a.currency === 'USD' || /ahorro|dolar|usd/i.test(normalizeStr(a.name)));
        if (usdAcc) return usdAcc;
      }

      const bankDebitPatterns = /\b(brou|debito|banco|tarjeta|cuenta brou)\b/i;
      if (bankDebitPatterns.test(norm)) {
        const bankAcc = state.accounts.find(a => a.id === 'acc_uyu' || /brou|debito|banco/i.test(normalizeStr(a.name)));
        if (bankAcc) return bankAcc;
      }

      return null;
    }

    function resolveAccountForSegment(segText, fullText, isUSD) {
      const segMatch = findAccountMentionInText(segText);
      if (segMatch) return segMatch;

      if (ui.voiceTargetAccountId && ui.voiceTargetAccountId !== 'auto') {
        const manualAcc = state.accounts.find(a => a.id === ui.voiceTargetAccountId);
        if (manualAcc) return manualAcc;
      }

      const globalMatch = findAccountMentionInText(fullText);
      if (globalMatch) return globalMatch;

      if (isUSD) {
        const usdAcc = state.accounts.find(a => a.currency === 'USD');
        if (usdAcc) return usdAcc;
      }

      return state.accounts[0];
    }

    function stripAccountPhrasesFromTitle(rawTitle) {
      let cleaned = rawTitle;
      state.accounts.forEach(acc => {
        const parts = acc.name.split(/[\/\-,()]+/).map(p => p.trim()).filter(p => p.length >= 3);
        parts.forEach(part => {
          const escaped = part.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          const rx = new RegExp(`\\b(con|en|de|desde|por|a|en la|de la|con la|en el|del|al)?\\s*(cuenta\\s+)?${escaped}\\b`, 'gi');
          cleaned = cleaned.replace(rx, ' ');
        });
      });

      cleaned = cleaned
        .replace(/\b(con|en|de|desde|por|a)?\s*(la\s+|el\s+|mi\s+)?(cuenta\s+)?(efectivo|billetera|cash|contado|en mano|monedero|brou|debito|débito|banco|tarjeta de debito|tarjeta|ahorro dolares|ahorro en dolares|ahorro|cuenta en dolares|cuenta dolares)\b/gi, ' ')
        .replace(/\s+/g, ' ')
        .replace(/^[.,;:\-\s]+|[.,;:\-\s]+$/g, '')
        .trim();
      return cleaned;
    }

    function speakText(text) {
      if (!state.ttsEnabled || !('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = state.voiceLang || 'es-UY';
      utter.rate = 1.06;
      window.speechSynthesis.speak(utter);
    }

    function processGeminiCommand(rawInput, fromExternalGemini = false) {
      if (!rawInput || !rawInput.trim()) return;
      const text = rawInput.trim().replace(/^(?:krono[:\s,-]*)/i, '').trim();
      const lower = text.toLowerCase();

      if ((lower.includes('actualiza') || lower.includes('release') || lower.includes('github')) && (lower.includes('app') || lower.includes('ota') || lower.includes('versión'))) {
        ui.showOtaModal = true;
        checkGitHubReleaseOtaUpdate(true);
        render();
        return;
      }

      if (lower.includes('cuánto') || lower.includes('cuanto') || lower.includes('saldo') || lower.includes('patrimonio')) {
        const specificAcc = findAccountMentionInText(text);
        if (specificAcc) {
          const replyAcc = `El saldo de ${specificAcc.name} es de ${formatMoney(specificAcc.balance, specificAcc.currency)}.`;
          ui.geminiResponse = { mode: 'query', prompt: text, reply: replyAcc, items: [] };
          speakText(replyAcc);
          render();
          return;
        }
        const totals = getTotals();
        const reply = `Tu patrimonio total consolidado es de ${formatMoney(totals.totalUYU, 'UYU')}, equivalente a ${formatMoney(totals.totalUSD, 'USD')}. Ingresos del mes: ${formatMoney(totals.monthIncomeUYU, 'UYU')}. Gastos: ${formatMoney(totals.monthExpenseUYU, 'UYU')}.`;
        ui.geminiResponse = { mode: 'query', prompt: text, reply, items: [] };
        speakText(reply);
        render();
        return;
      }

      const segments = text.split(/(?:,|;|\s+y\s+(?=(?:gast|pagu|compr|cobr|recib|ingres|con|en|\d)))/i).map(s => s.trim()).filter(Boolean);
      const createdItems = [];

      segments.forEach(seg => {
        const sLower = seg.toLowerCase();
        const numMatch = seg.match(/(\d+(?:[.,]\d+)?)/);
        if (!numMatch) return;
        let amount = parseFloat(numMatch[1].replace(',', '.'));
        if (sLower.includes('mil') && amount < 100) amount *= 1000;
        const isUSD = /\b(dolar|dolares|dólar|dólares|usd|u\$s)\b/i.test(sLower);
        const isIncome = /\b(cobr|ingres|sueldo|recib|deposit|gan)\b/i.test(sLower);
        const type = isIncome ? 'income' : 'expense';

        const targetAccount = resolveAccountForSegment(seg, text, isUSD);

        let category = isIncome ? 'Ingreso' : 'Comida y Súper';
        if (/\b(luz|agua|internet|antel|ute|ose|gas|alquiler|servicio|tarifa)\b/i.test(sLower)) category = 'Servicios y Luz';
        else if (/\b(nafta|uber|boleto|auto|bus|omnibus|ómnibus|taxi|peaje|estacionamiento)\b/i.test(sLower)) category = 'Transporte y Nafta';
        else {
          const matchedBudget = state.budgets.find(b => normalizeStr(seg).includes(normalizeStr(b.name.split(' ')[0])));
          if (matchedBudget) category = matchedBudget.name;
        }

        let cleanTitle = seg
          .replace(/^(hey\s+gemini|gemini|krono)[,\s]*/i, '')
          .replace(/(\d+(?:[.,]\d+)?)\s*(mil)?/gi, ' ')
          .replace(/\b(gasté|gaste|pagué|pague|compré|compre|cobré|cobre|recibí|recibi|ingresé|ingrese|cargué|cargue|agregué|agregue|en|de|por|con|desde|pesos|dólares|dolares|dolar|dólar|usd|uyu|mil)\b/gi, ' ');

        cleanTitle = stripAccountPhrasesFromTitle(cleanTitle);
        cleanTitle = cleanTitle ? (cleanTitle.charAt(0).toUpperCase() + cleanTitle.slice(1)) : (isIncome ? 'Ingreso registrado' : category);

        const tx = addTransaction({
          title: cleanTitle,
          amount,
          currency: isUSD ? 'USD' : 'UYU',
          type,
          category,
          accountId: targetAccount ? targetAccount.id : null,
          fromExternal: fromExternalGemini
        });
        if (tx) createdItems.push(tx);
      });

      if (createdItems.length > 0) {
        const prefix = fromExternalGemini ? '[Botón Encendido / Gemini Externo] ' : '';
        const summaryParts = createdItems.map(item => `${item.title} (${formatMoney(item.amount, item.currency)} en ${item.accountName})`);
        const reply = createdItems.length === 1
          ? `${prefix}Registré ${summaryParts[0]}.`
          : `${prefix}Registré ${createdItems.length} movimientos: ${summaryParts.join(' y ')}.`;
        ui.geminiResponse = { mode: 'action', prompt: text, reply, items: createdItems };
        speakText(reply);
      } else if (!fromExternalGemini) {
        const fallback = 'No detecté un monto numérico. Probá decir: "Gasté 850 en súper con efectivo y 1200 de luz con débito".';
        ui.geminiResponse = { mode: 'error', prompt: text, reply: fallback, items: [] };
        speakText(fallback);
      }
      render();
    }

    let recognition = null;
    function startVoiceCapture(autoFromWidget = false) {
      if (autoFromWidget) ui.showVoiceWidgetOverlay = true;
      const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRec) {
        ui.isListening = false;
        render();
        const manual = prompt('Dictá o escribí tu comando para Gemini (podés nombrar la cuenta, ej: con efectivo, con débito, en ahorro dólares):', 'Gasté 850 en súper con efectivo');
        if (manual) processGeminiCommand(manual);
        return;
      }
      try {
        recognition = new SpeechRec();
        recognition.lang = state.voiceLang || 'es-UY';
        recognition.interimResults = true;
        ui.isListening = true;
        ui.voiceTranscript = '';
        render();
        recognition.onresult = (event) => { ui.voiceTranscript = event.results[0][0].transcript; render(); };
        recognition.onend = () => {
          ui.isListening = false;
          if (ui.voiceTranscript.trim()) processGeminiCommand(ui.voiceTranscript);
          render();
        };
        recognition.onerror = () => { ui.isListening = false; render(); };
        recognition.start();
      } catch (e) { ui.isListening = false; render(); }
    }

      if (recognition) recognition.stop();
